<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="28" fill="#FFFDFC"/>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="110" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="64" font-weight="800">CUDA、Metal、ROCm 的角色定位</text>
  <text x="80" y="165" fill="#5C7095" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="500">它們都在加速平台層，但對應的硬體生態和你實際接觸它們的方式不同。</text>

  <rect x="100" y="250" width="420" height="520" rx="30" fill="#FFFFFF" stroke="#B8CEF7" stroke-width="4"/>
  <rect x="590" y="250" width="420" height="520" rx="30" fill="#FFFFFF" stroke="#FFD39F" stroke-width="4"/>
  <rect x="1080" y="250" width="420" height="520" rx="30" fill="#FFFFFF" stroke="#9EDBC9" stroke-width="4"/>

  <text x="310" y="320" text-anchor="middle" fill="#2D6BEA" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="800">CUDA</text>
  <text x="310" y="370" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">NVIDIA GPU 生態</text>
  <rect x="170" y="430" width="280" height="70" rx="22" fill="#EAF2FF"/>
  <rect x="170" y="525" width="280" height="70" rx="22" fill="#EAF2FF"/>
  <rect x="170" y="620" width="280" height="70" rx="22" fill="#EAF2FF"/>
  <text x="310" y="473" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">平行運算平台</text>
  <text x="310" y="568" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">深度學習框架常直接接上</text>
  <text x="310" y="663" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">PC / 工作站最常見</text>

  <text x="800" y="320" text-anchor="middle" fill="#FF9A52" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="800">Metal</text>
  <text x="800" y="370" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">Apple compute 路徑</text>
  <rect x="660" y="430" width="280" height="70" rx="22" fill="#FFF4E8"/>
  <rect x="660" y="525" width="280" height="70" rx="22" fill="#FFF4E8"/>
  <rect x="660" y="620" width="280" height="70" rx="22" fill="#FFF4E8"/>
  <text x="800" y="473" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">graphics / compute API</text>
  <text x="800" y="568" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">PyTorch 常走 MPS backend</text>
  <text x="800" y="663" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">TensorFlow 常走 metal plugin</text>

  <text x="1290" y="320" text-anchor="middle" fill="#27A37B" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="800">ROCm</text>
  <text x="1290" y="370" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">AMD GPU 軟體堆疊</text>
  <rect x="1150" y="430" width="280" height="70" rx="22" fill="#F1FBF7"/>
  <rect x="1150" y="525" width="280" height="70" rx="22" fill="#F1FBF7"/>
  <rect x="1150" y="620" width="280" height="70" rx="22" fill="#F1FBF7"/>
  <text x="1290" y="473" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">開放 GPU 計算堆疊</text>
  <text x="1290" y="568" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">常和 HIP 一起出現</text>
  <text x="1290" y="663" text-anchor="middle" fill="#1D2B4F" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700">讓框架有機會吃到 AMD GPU</text>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4EA"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF8FF"/>
    </linearGradient>
  </defs>
