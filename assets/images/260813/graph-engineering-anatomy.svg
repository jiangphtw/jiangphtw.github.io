    <path d="M925 425C1020 425 1005 300 1080 300"/>
    <path d="M1260 300H1360"/>
    <path d="M1450 390V510"/>
    <path d="M1360 600H1230"/>
    <path d="M1070 600H920"/>
    <path d="M780 600H620"/>
    <path d="M515 535V355"/>
    <path d="M1450 690V800H1240"/>
  </g>
  <path d="M1160 545V355" fill="none" stroke="#17364d" stroke-width="5" marker-end="url(#arrow)"/>

