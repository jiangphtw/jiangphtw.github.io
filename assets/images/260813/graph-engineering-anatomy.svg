    <rect x="400" y="245" width="190" height="110" rx="24" fill="#244b66"/>
    <text x="495" y="292" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">規劃與路由</text>
    <text x="495" y="324" text-anchor="middle" fill="#dfff42" font-size="18">Router Node</text>

    <rect x="755" y="160" width="170" height="90" rx="22" fill="#fff" stroke="#3c6480" stroke-width="3"/>
    <text x="840" y="198" text-anchor="middle" fill="#0c2335" font-size="22" font-weight="800">研究 A</text>
    <text x="840" y="228" text-anchor="middle" fill="#526978" font-size="17">Parallel Node</text>
    <rect x="755" y="270" width="170" height="90" rx="22" fill="#fff" stroke="#3c6480" stroke-width="3"/>
    <text x="840" y="308" text-anchor="middle" fill="#0c2335" font-size="22" font-weight="800">研究 B</text>
    <text x="840" y="338" text-anchor="middle" fill="#526978" font-size="17">Parallel Node</text>
    <rect x="755" y="380" width="170" height="90" rx="22" fill="#fff" stroke="#3c6480" stroke-width="3"/>
