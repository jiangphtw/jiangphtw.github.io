    <text x="515" y="617" text-anchor="middle" fill="#dfff42" font-size="18">Checkpoint</text>

    <rect x="1040" y="770" width="200" height="120" rx="24" fill="#0c2335"/>
    <text x="1140" y="820" text-anchor="middle" fill="#dfff42" font-size="25" font-weight="800">發布結果</text>
    <text x="1140" y="853" text-anchor="middle" fill="#dce5ea" font-size="18">Output</text>
  </g>

  <g font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700">
    <rect x="960" y="690" width="570" height="47" rx="23" fill="#e0e7ea"/>
