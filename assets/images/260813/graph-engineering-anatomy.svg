<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Graph Engineering 的工作圖解剖</title>
  <desc id="desc">一個研究與寫作工作圖，包含路由、平行研究、匯合、驗證、重試、人工審核與發布節點。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#17364d"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#081b2c" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="980" fill="#f6f2e8"/>
  <text x="88" y="86" fill="#0c2335" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="43" font-weight="800">Graph Engineering：把不確定推理放進可治理流程</text>
  <text x="88" y="130" fill="#526978" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24">Node 負責局部判斷；Edge、State 與 Gate 負責全局控制</text>

  <g fill="none" stroke="#17364d" stroke-width="5" marker-end="url(#arrow)">
