    <text x="1150" y="592" text-anchor="middle" fill="#542b23" font-size="23" font-weight="800">退回修正</text>
    <text x="1150" y="624" text-anchor="middle" fill="#6e3f35" font-size="18">Retry</text>

    <rect x="780" y="545" width="140" height="110" rx="24" fill="#fff" stroke="#cc6f53" stroke-width="3"/>
