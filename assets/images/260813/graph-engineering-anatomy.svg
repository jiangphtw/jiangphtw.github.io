    <path d="M590 300C680 300 670 205 755 205"/>
    <path d="M590 300C680 300 670 315 755 315"/>
    <path d="M590 300C680 300 670 425 755 425"/>
    <path d="M925 205C1020 205 1005 300 1080 300"/>
