<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">高品質 Prompt 的八個組成部分</title>
  <desc id="desc">Prompt 由角色、目標、背景、輸入資料、限制、範例、輸出契約與成功條件組成，並送入模型產生可驗證結果。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#092033" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#17384f"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f6f2e8"/>
  <g opacity=".18" stroke="#244b66"><path d="M0 125H1600M0 250H1600M0 375H1600M0 500H1600M0 625H1600M0 750H1600M0 875H1600"/><path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/></g>
  <text x="90" y="82" fill="#0c2335" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="44" font-weight="800">Prompt 不是一句咒語，而是一份迷你規格書</text>
  <text x="90" y="127" fill="#4f6777" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24">不必每次填滿八格；只保留會改變模型行為的資訊</text>

  <g font-family="Arial, 'Noto Sans TC', sans-serif" filter="url(#shadow)">
    <rect x="90" y="185" width="390" height="130" rx="25" fill="#0c2335"/>
    <circle cx="155" cy="250" r="34" fill="#dfff42"/><text x="155" y="259" text-anchor="middle" fill="#0c2335" font-size="25" font-weight="900">01</text>
    <text x="215" y="239" fill="#fff" font-size="28" font-weight="800">角色與職責 Role</text>
    <text x="215" y="276" fill="#cbd7df" font-size="20">模型負責什麼、不負責什麼</text>

    <rect x="90" y="335" width="390" height="130" rx="25" fill="#244b66"/>
    <circle cx="155" cy="400" r="34" fill="#dfff42"/><text x="155" y="409" text-anchor="middle" fill="#0c2335" font-size="25" font-weight="900">02</text>
    <text x="215" y="389" fill="#fff" font-size="28" font-weight="800">目標 Goal</text>
    <text x="215" y="426" fill="#d8e2e8" font-size="20">最終要完成的使用者成果</text>

    <rect x="90" y="485" width="390" height="130" rx="25" fill="#3f6985"/>
    <circle cx="155" cy="550" r="34" fill="#dfff42"/><text x="155" y="559" text-anchor="middle" fill="#0c2335" font-size="25" font-weight="900">03</text>
    <text x="215" y="539" fill="#fff" font-size="28" font-weight="800">背景 Context</text>
    <text x="215" y="576" fill="#e1e9ed" font-size="20">受眾、情境、已知事實與目的</text>

    <rect x="90" y="635" width="390" height="130" rx="25" fill="#d8e2e7"/>
    <circle cx="155" cy="700" r="34" fill="#0c2335"/><text x="155" y="709" text-anchor="middle" fill="#dfff42" font-size="25" font-weight="900">04</text>
    <text x="215" y="689" fill="#0c2335" font-size="28" font-weight="800">輸入資料 Input</text>
    <text x="215" y="726" fill="#496273" font-size="20">待處理內容與清楚的資料邊界</text>

    <rect x="545" y="185" width="390" height="130" rx="25" fill="#dfff42"/>
    <circle cx="610" cy="250" r="34" fill="#0c2335"/><text x="610" y="259" text-anchor="middle" fill="#dfff42" font-size="25" font-weight="900">05</text>
    <text x="670" y="239" fill="#0c2335" font-size="28" font-weight="800">限制 Constraints</text>
    <text x="670" y="276" fill="#304532" font-size="20">政策、範圍、語氣與禁止事項</text>

    <rect x="545" y="335" width="390" height="130" rx="25" fill="#c9ef42"/>
    <circle cx="610" cy="400" r="34" fill="#0c2335"/><text x="610" y="409" text-anchor="middle" fill="#dfff42" font-size="25" font-weight="900">06</text>
    <text x="670" y="389" fill="#0c2335" font-size="28" font-weight="800">範例 Examples</text>
    <text x="670" y="426" fill="#304532" font-size="20">少量但代表性的輸入／輸出對</text>

    <rect x="545" y="485" width="390" height="130" rx="25" fill="#b9df37"/>
    <circle cx="610" cy="550" r="34" fill="#0c2335"/><text x="610" y="559" text-anchor="middle" fill="#dfff42" font-size="25" font-weight="900">07</text>
    <text x="670" y="539" fill="#0c2335" font-size="28" font-weight="800">輸出契約 Output</text>
    <text x="670" y="576" fill="#304532" font-size="20">欄位、格式、長度與必要證據</text>

    <rect x="545" y="635" width="390" height="130" rx="25" fill="#0c2335"/>
    <circle cx="610" cy="700" r="34" fill="#dfff42"/><text x="610" y="709" text-anchor="middle" fill="#0c2335" font-size="25" font-weight="900">08</text>
    <text x="670" y="689" fill="#fff" font-size="28" font-weight="800">成功條件 Success</text>
    <text x="670" y="726" fill="#cbd7df" font-size="20">完成、追問、拒答與停止規則</text>
  </g>

  <path d="M975 475H1070" fill="none" stroke="#17384f" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="Arial, 'Noto Sans TC', sans-serif" filter="url(#shadow)">
    <rect x="1080" y="330" width="220" height="290" rx="38" fill="#0c2335"/>
    <path d="M1130 435l60-45 60 45v80l-60 45-60-45z" fill="none" stroke="#dfff42" stroke-width="7"/>
    <circle cx="1190" cy="475" r="27" fill="#dfff42"/>
    <text x="1190" y="581" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">LLM</text>

    <rect x="1360" y="360" width="170" height="230" rx="28" fill="#fff" stroke="#244b66" stroke-width="3"/>
    <path d="M1400 410h90M1400 450h65M1400 490h80" stroke="#244b66" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1445" cy="540" r="25" fill="#dfff42"/><path d="M1433 540l9 9 17-20" fill="none" stroke="#0c2335" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1445" y="630" text-anchor="middle" fill="#0c2335" font-size="23" font-weight="800">可驗證結果</text>
  </g>
  <path d="M1300 475H1350" fill="none" stroke="#17384f" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="90" y="830" width="1440" height="92" rx="30" fill="#e2e9ec"/>
  <text x="810" y="872" text-anchor="middle" fill="#0c2335" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="23" font-weight="800">設計原則：Goal 與 Success 幾乎必填；Role、Examples 與細節只在能修正實際失敗時加入</text>
  <text x="810" y="904" text-anchor="middle" fill="#4f6777" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="19">Prompt 越長不一定越好；清楚、無矛盾、可測試，才是工程品質</text>
</svg>
