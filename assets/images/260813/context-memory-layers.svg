<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Context Engineering 的四層記憶</title>
  <desc id="desc">工作記憶位於 Context Window 內，情節、語意與程序記憶位於外部儲存，透過嚴格寫入政策與按需檢索交換資料。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#092033" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#17384f"/></marker>
  </defs>
  <rect width="1600" height="940" fill="#f6f2e8"/>
  <g opacity=".16" stroke="#244b66"><path d="M0 135H1600M0 270H1600M0 405H1600M0 540H1600M0 675H1600M0 810H1600"/><path d="M200 0V940M400 0V940M600 0V940M800 0V940M1000 0V940M1200 0V940M1400 0V940"/></g>
  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <text x="80" y="76" fill="#0c2335" font-size="43" font-weight="800">Memory 不是完整聊天紀錄，而是有生命週期的資料</text>
    <text x="80" y="119" fill="#4f6777" font-size="23">每一層有不同用途、更新頻率、Scope 與保存政策</text>

    <g filter="url(#shadow)">
      <rect x="90" y="186" width="630" height="540" rx="42" fill="#0c2335"/>
      <text x="140" y="242" fill="#dfff42" font-size="24" font-weight="800">IN-CONTEXT · 短期</text>
      <text x="140" y="288" fill="#fff" font-size="34" font-weight="800">Working Memory</text>
      <text x="140" y="326" fill="#cbd7df" font-size="22">當前任務的工作記憶</text>
      <rect x="140" y="374" width="530" height="274" rx="28" fill="#18384e" stroke="#3f6985" stroke-width="3"/>
      <rect x="182" y="415" width="446" height="47" rx="15" fill="#dfff42"/><text x="405" y="446" text-anchor="middle" fill="#0c2335" font-size="20" font-weight="800">Goal · Success Criteria</text>
      <rect x="182" y="481" width="446" height="47" rx="15" fill="#fff"/><text x="405" y="512" text-anchor="middle" fill="#0c2335" font-size="20" font-weight="800">Plan · Assumptions · Open Questions</text>
      <rect x="182" y="547" width="446" height="47" rx="15" fill="#dce5e9"/><text x="405" y="578" text-anchor="middle" fill="#0c2335" font-size="20" font-weight="800">Recent Evidence · Tool Results</text>
      <text x="405" y="684" text-anchor="middle" fill="#cbd7df" font-size="19">任務結束後清除、歸檔或壓縮</text>

      <rect x="880" y="186" width="630" height="540" rx="42" fill="#fff" stroke="#244b66" stroke-width="3"/>
      <text x="930" y="242" fill="#4f6777" font-size="24" font-weight="800">EXTERNAL STORE · 長期</text>

      <rect x="930" y="287" width="530" height="111" rx="24" fill="#244b66"/>
      <circle cx="985" cy="342" r="28" fill="#dfff42"/><text x="985" y="351" text-anchor="middle" fill="#0c2335" font-size="22" font-weight="900">E</text>
      <text x="1034" y="333" fill="#fff" font-size="27" font-weight="800">Episodic 情節記憶</text>
      <text x="1034" y="367" fill="#d8e2e8" font-size="19">有時間與情境的過去事件</text>

      <rect x="930" y="421" width="530" height="111" rx="24" fill="#dfff42"/>
      <circle cx="985" cy="476" r="28" fill="#0c2335"/><text x="985" y="485" text-anchor="middle" fill="#dfff42" font-size="22" font-weight="900">S</text>
      <text x="1034" y="467" fill="#0c2335" font-size="27" font-weight="800">Semantic 語意記憶</text>
      <text x="1034" y="501" fill="#304532" font-size="19">經確認且相對穩定的事實與偏好</text>

      <rect x="930" y="555" width="530" height="111" rx="24" fill="#dce5e9"/>
      <circle cx="985" cy="610" r="28" fill="#0c2335"/><text x="985" y="619" text-anchor="middle" fill="#dfff42" font-size="22" font-weight="900">P</text>
      <text x="1034" y="601" fill="#0c2335" font-size="27" font-weight="800">Procedural 程序記憶</text>
      <text x="1034" y="635" fill="#496273" font-size="19">SOP、技能、規範與可重用方法</text>
    </g>

    <path d="M735 382h126" stroke="#17384f" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M865 590H739" stroke="#17384f" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="800" y="357" text-anchor="middle" fill="#0c2335" font-size="19" font-weight="800">嚴格寫入</text>
    <text x="800" y="631" text-anchor="middle" fill="#0c2335" font-size="19" font-weight="800">按需檢索</text>

    <rect x="210" y="792" width="1180" height="92" rx="28" fill="#e2e9ec"/>
    <text x="800" y="831" text-anchor="middle" fill="#0c2335" font-size="23" font-weight="800">寫入檢查：明確嗎？穩定嗎？未來有用嗎？允許保存嗎？何時到期？如何更正或刪除？</text>
    <text x="800" y="862" text-anchor="middle" fill="#4f6777" font-size="18">每筆記憶都應保存 Source · Confidence · Scope · Created At · Expires At · Status</text>
  </g>
</svg>
