<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">五種常見 Agent Loop Pattern</title>
  <desc id="desc">比較 Tool-use ReAct、Plan Execute Replan、Evaluator Optimizer、Test Repair 與 Nested Supervisor Worker 五種迴圈。</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#092033" flood-opacity=".13"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6z" fill="#dfff42"/></marker></defs>
  <rect width="1600" height="1000" fill="#f6f2e8"/>
  <g opacity=".14" stroke="#244b66"><path d="M0 125H1600M0 250H1600M0 375H1600M0 500H1600M0 625H1600M0 750H1600M0 875H1600"/><path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/></g>
  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <text x="78" y="76" fill="#0c2335" font-size="43" font-weight="800">五種常見 Loop Pattern：依回饋來源選擇</text>
    <text x="78" y="119" fill="#4f6777" font-size="23">最好的迴圈不是最複雜，而是能取得可靠回饋並知道何時停止</text>
    <g filter="url(#s)">
      <rect x="70" y="175" width="460" height="315" rx="34" fill="#0c2335"/>
      <text x="110" y="226" fill="#dfff42" font-size="25" font-weight="800">01　Tool-use／ReAct</text><text x="110" y="261" fill="#cbd7df" font-size="18">模型選工具，觀察結果，再決定下一步</text>
      <g fill="#dfff42"><circle cx="155" cy="342" r="31"/><circle cx="300" cy="342" r="31"/><circle cx="445" cy="342" r="31"/></g><g fill="none" stroke="#dfff42" stroke-width="5" marker-end="url(#a)"><path d="M188 342h75"/><path d="M333 342h75"/><path d="M445 375Q300 445 155 375"/></g>
      <text x="155" y="349" text-anchor="middle" fill="#0c2335" font-size="16" font-weight="800">想</text><text x="300" y="349" text-anchor="middle" fill="#0c2335" font-size="16" font-weight="800">做</text><text x="445" y="349" text-anchor="middle" fill="#0c2335" font-size="16" font-weight="800">看</text>
      <text x="110" y="454" fill="#fff" font-size="18" font-weight="800">適合：開放式工具任務　風險：漂移、重複呼叫</text>

      <rect x="570" y="175" width="460" height="315" rx="34" fill="#244b66"/>
      <text x="610" y="226" fill="#dfff42" font-size="25" font-weight="800">02　Plan → Execute → Replan</text><text x="610" y="261" fill="#d8e2e8" font-size="18">先建立可追蹤計畫，再依結果更新剩餘步驟</text>
      <rect x="620" y="310" width="110" height="66" rx="19" fill="#dfff42"/><rect x="770" y="310" width="110" height="66" rx="19" fill="#dce5e9"/><rect x="920" y="310" width="70" height="66" rx="19" fill="#dfff42"/><g stroke="#dfff42" stroke-width="5" marker-end="url(#a)"><path d="M735 343h28"/><path d="M885 343h28"/><path d="M955 383Q805 445 675 383"/></g>
      <text x="675" y="351" text-anchor="middle" fill="#0c2335" font-size="16" font-weight="800">PLAN</text><text x="825" y="351" text-anchor="middle" fill="#0c2335" font-size="16" font-weight="800">EXECUTE</text><text x="955" y="351" text-anchor="middle" fill="#0c2335" font-size="16" font-weight="800">CHECK</text>
      <text x="610" y="454" fill="#fff" font-size="18" font-weight="800">適合：長任務　風險：計畫過時、重規劃成本</text>

      <rect x="1070" y="175" width="460" height="315" rx="34" fill="#dfff42"/>
      <text x="1110" y="226" fill="#0c2335" font-size="25" font-weight="800">03　Evaluator → Optimizer</text><text x="1110" y="261" fill="#304532" font-size="18">生成器交付草稿，評估器提供具體回饋</text>
      <rect x="1130" y="309" width="145" height="70" rx="22" fill="#0c2335"/><rect x="1330" y="309" width="145" height="70" rx="22" fill="#244b66"/><g stroke="#0c2335" stroke-width="5"><path d="M1280 330h43"/><path d="M1330 370Q1300 420 1238 385"/></g>
      <text x="1202" y="352" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">OPTIMIZER</text><text x="1402" y="352" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">EVALUATOR</text>
      <text x="1110" y="454" fill="#0c2335" font-size="18" font-weight="800">適合：有明確品質準則　風險：裁判偏誤</text>

      <rect x="320" y="535" width="460" height="315" rx="34" fill="#dce5e9"/>
      <text x="360" y="586" fill="#0c2335" font-size="25" font-weight="800">04　Test → Repair</text><text x="360" y="621" fill="#496273" font-size="18">用編譯器、測試或 Validator 提供外部真相</text>
      <g fill="#0c2335"><rect x="390" y="675" width="110" height="70" rx="20"/><rect x="600" y="675" width="110" height="70" rx="20"/></g><path d="M505 710h87M655 752Q550 810 445 752" fill="none" stroke="#244b66" stroke-width="5"/>
      <text x="445" y="719" text-anchor="middle" fill="#dfff42" font-size="17" font-weight="800">REPAIR</text><text x="655" y="719" text-anchor="middle" fill="#dfff42" font-size="17" font-weight="800">TEST</text>
      <text x="360" y="814" fill="#0c2335" font-size="18" font-weight="800">適合：程式與結構資料　風險：只為測試投機</text>

      <rect x="820" y="535" width="460" height="315" rx="34" fill="#3f6985"/>
      <text x="860" y="586" fill="#fff" font-size="25" font-weight="800">05　Nested Supervisor／Worker</text><text x="860" y="621" fill="#e7eff3" font-size="18">外圈管任務，內圈讓 Worker 局部求解與驗證</text>
      <circle cx="1050" cy="713" r="105" fill="none" stroke="#dfff42" stroke-width="7"/><circle cx="1050" cy="713" r="55" fill="#0c2335"/><path d="M1050 650a63 63 0 1 1-42 16" fill="none" stroke="#dfff42" stroke-width="5"/>
      <text x="1050" y="707" text-anchor="middle" fill="#dfff42" font-size="16" font-weight="800">WORKER</text><text x="1050" y="730" text-anchor="middle" fill="#fff" font-size="15">LOOP</text><text x="1160" y="705" fill="#fff" font-size="16" font-weight="800">SUPERVISOR</text>
      <text x="860" y="814" fill="#fff" font-size="18" font-weight="800">適合：複雜分工　風險：成本放大與巢狀失控</text>
    </g>
    <rect x="285" y="900" width="1030" height="62" rx="23" fill="#e2e9ec"/><text x="800" y="939" text-anchor="middle" fill="#0c2335" font-size="21" font-weight="800">優先順序：External verifier ＞ 具體 Evaluator rubric ＞ 純 Self-reflection</text>
  </g>
</svg>

