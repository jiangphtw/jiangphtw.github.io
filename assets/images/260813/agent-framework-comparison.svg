<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">四個開源 Agent Harness 的定位比較</title>
  <desc id="desc">比較 Hermes Agent、OpenClaw、Pi Agent 與 nanobot 的設計中心、強項與安全重點。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#092033" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f6f2e8"/>
  <g opacity=".14" stroke="#244b66"><path d="M0 125H1600M0 250H1600M0 375H1600M0 500H1600M0 625H1600M0 750H1600M0 875H1600"/><path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/></g>
  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <text x="80" y="76" fill="#0c2335" font-size="43" font-weight="800">四種 Agent Harness，四個不同的設計中心</text>
    <text x="80" y="119" fill="#4f6777" font-size="23">學習 · Gateway · 極簡可塑性 · 輕量完整性；選型先看工作型態與安全邊界</text>
    <g filter="url(#shadow)">
      <rect x="70" y="180" width="345" height="660" rx="38" fill="#0c2335"/>
      <circle cx="243" cy="285" r="62" fill="#dfff42"/><path d="M215 292c18-38 58-38 58 0M226 270l17-19 17 19" fill="none" stroke="#0c2335" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="243" y="390" text-anchor="middle" fill="#fff" font-size="33" font-weight="800">Hermes Agent</text>
      <text x="243" y="429" text-anchor="middle" fill="#dfff42" font-size="20" font-weight="800">學習型長期 Agent</text>
      <path d="M125 474h235" stroke="#3f6985" stroke-width="2"/>
      <text x="125" y="519" fill="#fff" font-size="21" font-weight="800">核心</text><text x="125" y="551" fill="#cbd7df" font-size="18">Memory · Skills · Gateway</text><text x="125" y="579" fill="#cbd7df" font-size="18">Cron · Subagents · MCP</text>
      <text x="125" y="635" fill="#fff" font-size="21" font-weight="800">強項</text><text x="125" y="667" fill="#cbd7df" font-size="18">跨 Session 累積方法與偏好</text>
      <text x="125" y="723" fill="#fff" font-size="21" font-weight="800">安全焦點</text><text x="125" y="755" fill="#cbd7df" font-size="18">Memory／Skill 變更治理</text>

      <rect x="442" y="180" width="345" height="660" rx="38" fill="#244b66"/>
      <circle cx="615" cy="285" r="62" fill="#dfff42"/><circle cx="615" cy="285" r="13" fill="#244b66"/><path d="M615 272V241M628 285h31M615 298v31M602 285h-31" stroke="#244b66" stroke-width="9" stroke-linecap="round"/>
      <text x="615" y="390" text-anchor="middle" fill="#fff" font-size="33" font-weight="800">OpenClaw</text>
      <text x="615" y="429" text-anchor="middle" fill="#dfff42" font-size="20" font-weight="800">多 Channel Agent Gateway</text>
      <path d="M497 474h235" stroke="#6688a0" stroke-width="2"/>
      <text x="497" y="519" fill="#fff" font-size="21" font-weight="800">核心</text><text x="497" y="551" fill="#d8e2e8" font-size="18">Gateway · Channels · Routing</text><text x="497" y="579" fill="#d8e2e8" font-size="18">Sessions · Nodes · Plugins</text>
      <text x="497" y="635" fill="#fff" font-size="21" font-weight="800">強項</text><text x="497" y="667" fill="#d8e2e8" font-size="18">Always-on 跨裝置助理</text>
      <text x="497" y="723" fill="#fff" font-size="21" font-weight="800">安全焦點</text><text x="497" y="755" fill="#d8e2e8" font-size="18">Host／Gateway／Plugin 邊界</text>

      <rect x="814" y="180" width="345" height="660" rx="38" fill="#dfff42"/>
      <circle cx="987" cy="285" r="62" fill="#0c2335"/><path d="M955 306l32-53 32 53M968 306h38" fill="none" stroke="#dfff42" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="987" y="390" text-anchor="middle" fill="#0c2335" font-size="33" font-weight="800">Pi Agent</text>
      <text x="987" y="429" text-anchor="middle" fill="#304532" font-size="20" font-weight="800">極簡 Coding Harness</text>
      <path d="M869 474h235" stroke="#91b21f" stroke-width="2"/>
      <text x="869" y="519" fill="#0c2335" font-size="21" font-weight="800">核心</text><text x="869" y="551" fill="#304532" font-size="18">Read · Write · Edit · Bash</text><text x="869" y="579" fill="#304532" font-size="18">Extensions · RPC · SDK</text>
      <text x="869" y="635" fill="#0c2335" font-size="21" font-weight="800">強項</text><text x="869" y="667" fill="#304532" font-size="18">最小核心、深度客製</text>
      <text x="869" y="723" fill="#0c2335" font-size="21" font-weight="800">安全焦點</text><text x="869" y="755" fill="#304532" font-size="18">需自行加 Permission／Sandbox</text>

      <rect x="1186" y="180" width="345" height="660" rx="38" fill="#dce5e9"/>
      <circle cx="1359" cy="285" r="62" fill="#0c2335"/><path d="M1328 286q31-43 62 0-5 37-31 37t-31-37z" fill="none" stroke="#dfff42" stroke-width="8"/><circle cx="1346" cy="285" r="5" fill="#dfff42"/><circle cx="1372" cy="285" r="5" fill="#dfff42"/>
      <text x="1359" y="390" text-anchor="middle" fill="#0c2335" font-size="33" font-weight="800">nanobot</text>
      <text x="1359" y="429" text-anchor="middle" fill="#496273" font-size="20" font-weight="800">輕量完整 Python Runtime</text>
      <path d="M1241 474h235" stroke="#aebdc5" stroke-width="2"/>
      <text x="1241" y="519" fill="#0c2335" font-size="21" font-weight="800">核心</text><text x="1241" y="551" fill="#496273" font-size="18">WebUI · Memory · MCP</text><text x="1241" y="579" fill="#496273" font-size="18">Gateway · Cron · SDK</text>
      <text x="1241" y="635" fill="#0c2335" font-size="21" font-weight="800">強項</text><text x="1241" y="667" fill="#496273" font-size="18">小核心與完整能力折衷</text>
      <text x="1241" y="723" fill="#0c2335" font-size="21" font-weight="800">安全焦點</text><text x="1241" y="755" fill="#496273" font-size="18">Workspace／Channel／Sandbox</text>
    </g>
    <rect x="160" y="884" width="1280" height="72" rx="24" fill="#e2e9ec"/>
    <text x="800" y="928" text-anchor="middle" fill="#0c2335" font-size="22" font-weight="800">共同責任：Self-host 不等於安全；Tools、Secrets、身份、Sandbox、Audit 與 Evals 都要明確治理</text>
  </g>
</svg>

