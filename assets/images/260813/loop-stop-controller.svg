<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Loop Stop Controller 停止條件</title>
  <desc id="desc">每圈先判斷成功、安全、阻塞、無進展與預算條件，再決定完成、人工介入、保留部分結果或繼續。</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#092033" flood-opacity=".13"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#244b66"/></marker></defs>
  <rect width="1600" height="1000" fill="#f6f2e8"/>
  <g opacity=".14" stroke="#244b66"><path d="M0 125H1600M0 250H1600M0 375H1600M0 500H1600M0 625H1600M0 750H1600M0 875H1600"/><path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/></g>
  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <text x="78" y="76" fill="#0c2335" font-size="43" font-weight="800">Stop Controller：停止不是失敗，而是 Loop Contract</text>
    <text x="78" y="119" fill="#4f6777" font-size="23">硬上限只是最後保險；成熟系統還會判斷成功、風險、阻塞與是否仍有進展</text>
    <g filter="url(#s)"><rect x="585" y="165" width="430" height="100" rx="30" fill="#0c2335"/><text x="800" y="207" text-anchor="middle" fill="#dfff42" font-size="26" font-weight="800">每一圈結束後評估</text><text x="800" y="239" text-anchor="middle" fill="#fff" font-size="18">State Delta · Evidence · Budget · Risk</text></g>
    <g fill="none" stroke="#244b66" stroke-width="5" marker-end="url(#a)"><path d="M800 265v72"/><path d="M800 445v55"/><path d="M800 610v55"/></g>
    <g filter="url(#s)">
      <rect x="495" y="335" width="610" height="110" rx="32" fill="#dfff42"/><text x="800" y="379" text-anchor="middle" fill="#0c2335" font-size="27" font-weight="800">1. 外部成功條件成立嗎？</text><text x="800" y="415" text-anchor="middle" fill="#304532" font-size="18">測試通過 · Artifact 存在 · Transaction 狀態正確</text>
      <rect x="495" y="500" width="610" height="110" rx="32" fill="#dce5e9"/><text x="800" y="544" text-anchor="middle" fill="#0c2335" font-size="27" font-weight="800">2. 必須停止或交給人嗎？</text><text x="800" y="580" text-anchor="middle" fill="#496273" font-size="18">風險升高 · 權限不足 · 不可逆操作 · 需求不明</text>
      <rect x="495" y="665" width="610" height="110" rx="32" fill="#244b66"/><text x="800" y="709" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">3. 還有預算，而且仍在進展嗎？</text><text x="800" y="745" text-anchor="middle" fill="#dfff42" font-size="18">Turns · Tokens · Cost · Time · Tool calls · State delta</text>
    </g>
    <g fill="none" stroke="#244b66" stroke-width="5" marker-end="url(#a)"><path d="M495 390H275"/><path d="M1105 555h220"/><path d="M495 720H275"/><path d="M1105 720h220"/></g>
    <g filter="url(#s)">
      <rect x="70" y="320" width="260" height="140" rx="30" fill="#dfff42"/><text x="200" y="367" text-anchor="middle" fill="#0c2335" font-size="26" font-weight="800">DONE</text><text x="200" y="403" text-anchor="middle" fill="#304532" font-size="18">提交已驗證結果</text><text x="200" y="432" text-anchor="middle" fill="#304532" font-size="16">記錄證據與版本</text>
      <rect x="1270" y="485" width="260" height="140" rx="30" fill="#dce5e9"/><text x="1400" y="532" text-anchor="middle" fill="#0c2335" font-size="26" font-weight="800">HUMAN</text><text x="1400" y="568" text-anchor="middle" fill="#496273" font-size="18">核准／澄清／接管</text><text x="1400" y="597" text-anchor="middle" fill="#496273" font-size="16">保存 Checkpoint</text>
      <rect x="70" y="650" width="260" height="140" rx="30" fill="#0c2335"/><text x="200" y="697" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">STOP</text><text x="200" y="733" text-anchor="middle" fill="#dfff42" font-size="18">Budget／Timeout</text><text x="200" y="762" text-anchor="middle" fill="#cbd7df" font-size="16">回傳 Best-so-far</text>
      <rect x="1270" y="650" width="260" height="140" rx="30" fill="#3f6985"/><text x="1400" y="697" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">CONTINUE</text><text x="1400" y="733" text-anchor="middle" fill="#dfff42" font-size="18">更新 Plan／Context</text><text x="1400" y="762" text-anchor="middle" fill="#e7eff3" font-size="16">進入下一圈</text>
    </g>
    <rect x="150" y="850" width="1300" height="95" rx="28" fill="#e2e9ec"/><text x="800" y="888" text-anchor="middle" fill="#0c2335" font-size="22" font-weight="800">無進展偵測：相同 Action fingerprint · State hash 不變 · 錯誤反覆 · A↔B 振盪 · 品質分數停滯</text><text x="800" y="921" text-anchor="middle" fill="#4f6777" font-size="18">觸發後先 Replan 或降級；仍無改善就停止，不能只把 max turns 調大</text>
  </g>
</svg>

