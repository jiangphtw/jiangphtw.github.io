<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Graph Runtime 的狀態、並行與復原生命週期</title>
  <desc id="desc">圖示一個工作圖如何讀取狀態、路由、平行執行、用 Reducer 合流、驗證、寫入檢查點並在中斷後恢復。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#17364d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#081b2c" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1600" height="980" fill="#f6f2e8"/>
  <text x="88" y="86" fill="#0c2335" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="43" font-weight="800">Graph Runtime：State、Superstep、Checkpoint 與 Resume</text>
  <text x="88" y="132" fill="#526978" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24">圖形只是設計；Runtime 才決定並行、合流、失敗與 Side effect 的真實語意</text>

  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <rect x="70" y="180" width="1460" height="560" rx="30" fill="#fff" stroke="#d2dadd" stroke-width="3"/>
    <text x="105" y="225" fill="#526978" font-size="20" font-weight="700">EXECUTION TIMELINE</text>
    <line x1="205" y1="250" x2="205" y2="690" stroke="#ccd7dc" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="520" y1="250" x2="520" y2="690" stroke="#ccd7dc" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="970" y1="250" x2="970" y2="690" stroke="#ccd7dc" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="1285" y1="250" x2="1285" y2="690" stroke="#ccd7dc" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="135" y="682" fill="#718490" font-size="18">Step 0</text><text x="390" y="682" fill="#718490" font-size="18">Superstep 1</text><text x="755" y="682" fill="#718490" font-size="18">Superstep 2</text><text x="1115" y="682" fill="#718490" font-size="18">Step 3</text><text x="1370" y="682" fill="#718490" font-size="18">Step 4</text>
  </g>

  <g fill="none" stroke="#17364d" stroke-width="5" marker-end="url(#arrow)">
    <path d="M195 430H330"/><path d="M490 430C565 430 560 325 635 325"/><path d="M490 430H635"/><path d="M490 430C565 430 560 535 635 535"/>
    <path d="M805 325C885 325 870 430 950 430"/><path d="M805 430H950"/><path d="M805 535C885 535 870 430 950 430"/>
    <path d="M1130 430H1240"/><path d="M1410 430H1490"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, 'Noto Sans TC', sans-serif" text-anchor="middle">
    <rect x="85" y="375" width="110" height="110" rx="24" fill="#0c2335"/><text x="140" y="420" fill="#dfff42" font-size="21" font-weight="800">讀取</text><text x="140" y="451" fill="#fff" font-size="19">State S₀</text>
    <rect x="330" y="375" width="160" height="110" rx="24" fill="#244b66"/><text x="410" y="421" fill="#fff" font-size="22" font-weight="800">Router</text><text x="410" y="452" fill="#dfff42" font-size="18">條件式 Edge</text>
    <rect x="635" y="280" width="170" height="90" rx="22" fill="#e0e7ea"/><text x="720" y="333" fill="#0c2335" font-size="21" font-weight="800">Worker A</text>
    <rect x="635" y="385" width="170" height="90" rx="22" fill="#dfff42"/><text x="720" y="438" fill="#0c2335" font-size="21" font-weight="800">Worker B</text>
    <rect x="635" y="490" width="170" height="90" rx="22" fill="#e0e7ea"/><text x="720" y="543" fill="#0c2335" font-size="21" font-weight="800">Worker C</text>
    <path d="M1040 350l90 52v104l-90 52-90-52V402z" fill="#f3b7a5"/><text x="1040" y="423" fill="#542b23" font-size="22" font-weight="800">Reducer</text><text x="1040" y="454" fill="#6e3f35" font-size="18">Join Contract</text>
    <rect x="1240" y="375" width="170" height="110" rx="24" fill="#244b66"/><text x="1325" y="421" fill="#fff" font-size="22" font-weight="800">Verifier</text><text x="1325" y="452" fill="#dfff42" font-size="18">Postcondition</text>
    <circle cx="1510" cy="430" r="50" fill="#dfff42"/><text x="1510" y="423" fill="#0c2335" font-size="19" font-weight="800">Commit</text><text x="1510" y="450" fill="#0c2335" font-size="17">S₄</text>
  </g>

  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <rect x="420" y="760" width="760" height="150" rx="30" fill="#0c2335"/>
    <text x="800" y="804" text-anchor="middle" fill="#dfff42" font-size="24" font-weight="800">持久化 Checkpoint Store</text>
    <text x="800" y="842" text-anchor="middle" fill="#fff" font-size="19">State schema + Node writes + Version + Pending work + Approval + Operation ID</text>
    <text x="800" y="877" text-anchor="middle" fill="#dce5ea" font-size="18">Crash 後從可重播邊界恢復；不確定的外部 Side effect 必須先 Reconcile</text>
  </g>
  <g fill="none" stroke="#789720" stroke-width="5" marker-end="url(#arrow)">
    <path d="M1325 485C1325 790 1220 835 1180 835"/>
    <path d="M420 835C250 835 250 560 330 475"/>
  </g>
  <g font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700">
    <rect x="1165" y="735" width="300" height="45" rx="22" fill="#e6f0bd"/><text x="1315" y="764" text-anchor="middle" fill="#40561b">成功／中斷後寫入檢查點</text>
    <rect x="155" y="705" width="260" height="45" rx="22" fill="#e6f0bd"/><text x="285" y="734" text-anchor="middle" fill="#40561b">Resume：重新進入節點</text>
    <text x="568" y="307" fill="#486071">Fan-out</text><text x="865" y="410" fill="#486071">Fan-in</text>
  </g>
</svg>
