<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">安全 Tool Call 的生命週期</title>
  <desc id="desc">模型提出工具呼叫後，必須通過結構驗證、授權、風險與人工核准，才在受控環境執行，接著驗證後置條件、記錄並把精簡結果送回模型。</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#092033" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#17384f"/></marker></defs>
  <rect width="1600" height="930" fill="#f6f2e8"/>
  <g opacity=".16" stroke="#244b66"><path d="M0 130H1600M0 260H1600M0 390H1600M0 520H1600M0 650H1600M0 780H1600"/><path d="M200 0V930M400 0V930M600 0V930M800 0V930M1000 0V930M1200 0V930M1400 0V930"/></g>
  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <text x="80" y="76" fill="#0c2335" font-size="43" font-weight="800">Tool Call 是待審提案，不是模型自行授權的命令</text>
    <text x="80" y="119" fill="#4f6777" font-size="23">每個外部動作都要通過明確的 Preflight、執行邊界與 Postcondition</text>
    <path d="M190 300H1410" stroke="#17384f" stroke-width="7" marker-end="url(#a)"/>
    <g filter="url(#s)" font-weight="800">
      <g><circle cx="190" cy="300" r="66" fill="#0c2335"/><text x="190" y="310" text-anchor="middle" fill="#dfff42" font-size="33">01</text><text x="190" y="405" text-anchor="middle" fill="#0c2335" font-size="24">模型提案</text><text x="190" y="437" text-anchor="middle" fill="#4f6777" font-size="17">Tool + Arguments</text></g>
      <g><circle cx="365" cy="300" r="66" fill="#244b66"/><text x="365" y="310" text-anchor="middle" fill="#dfff42" font-size="33">02</text><text x="365" y="405" text-anchor="middle" fill="#0c2335" font-size="24">Schema</text><text x="365" y="437" text-anchor="middle" fill="#4f6777" font-size="17">型別與必填欄位</text></g>
      <g><circle cx="540" cy="300" r="66" fill="#3f6985"/><text x="540" y="310" text-anchor="middle" fill="#dfff42" font-size="33">03</text><text x="540" y="405" text-anchor="middle" fill="#0c2335" font-size="24">身分授權</text><text x="540" y="437" text-anchor="middle" fill="#4f6777" font-size="17">Tenant · Scope</text></g>
      <g><circle cx="715" cy="300" r="66" fill="#dfff42"/><text x="715" y="310" text-anchor="middle" fill="#0c2335" font-size="33">04</text><text x="715" y="405" text-anchor="middle" fill="#0c2335" font-size="24">風險政策</text><text x="715" y="437" text-anchor="middle" fill="#4f6777" font-size="17">Allow · Deny</text></g>
      <g><circle cx="890" cy="300" r="66" fill="#c9ef42"/><text x="890" y="310" text-anchor="middle" fill="#0c2335" font-size="33">05</text><text x="890" y="405" text-anchor="middle" fill="#0c2335" font-size="24">人工核准</text><text x="890" y="437" text-anchor="middle" fill="#4f6777" font-size="17">必要時暫停續跑</text></g>
      <g><circle cx="1065" cy="300" r="66" fill="#0c2335"/><text x="1065" y="310" text-anchor="middle" fill="#dfff42" font-size="33">06</text><text x="1065" y="405" text-anchor="middle" fill="#0c2335" font-size="24">受控執行</text><text x="1065" y="437" text-anchor="middle" fill="#4f6777" font-size="17">Sandbox · Timeout</text></g>
      <g><circle cx="1240" cy="300" r="66" fill="#244b66"/><text x="1240" y="310" text-anchor="middle" fill="#dfff42" font-size="33">07</text><text x="1240" y="405" text-anchor="middle" fill="#0c2335" font-size="24">驗證結果</text><text x="1240" y="437" text-anchor="middle" fill="#4f6777" font-size="17">Postcondition</text></g>
      <g><circle cx="1415" cy="300" r="66" fill="#3f6985"/><text x="1415" y="310" text-anchor="middle" fill="#dfff42" font-size="33">08</text><text x="1415" y="405" text-anchor="middle" fill="#0c2335" font-size="24">記錄回傳</text><text x="1415" y="437" text-anchor="middle" fill="#4f6777" font-size="17">Audit + 精簡結果</text></g>
    </g>
    <g filter="url(#s)"><rect x="175" y="555" width="1250" height="255" rx="38" fill="#fff" stroke="#244b66" stroke-width="3"/><text x="230" y="612" fill="#0c2335" font-size="28" font-weight="800">四條不能省略的可靠性規則</text>
      <rect x="230" y="650" width="260" height="100" rx="23" fill="#0c2335"/><text x="360" y="690" text-anchor="middle" fill="#dfff42" font-size="21" font-weight="800">模型只提案</text><text x="360" y="721" text-anchor="middle" fill="#cbd7df" font-size="17">Policy 才能授權</text>
      <rect x="525" y="650" width="260" height="100" rx="23" fill="#dfff42"/><text x="655" y="690" text-anchor="middle" fill="#0c2335" font-size="21" font-weight="800">外部寫入要冪等</text><text x="655" y="721" text-anchor="middle" fill="#304532" font-size="17">Unknown 先查狀態</text>
      <rect x="820" y="650" width="260" height="100" rx="23" fill="#244b66"/><text x="950" y="690" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">成功由世界證明</text><text x="950" y="721" text-anchor="middle" fill="#d8e2e8" font-size="17">不能相信自我宣告</text>
      <rect x="1115" y="650" width="260" height="100" rx="23" fill="#dce5e9"/><text x="1245" y="690" text-anchor="middle" fill="#0c2335" font-size="21" font-weight="800">結果精簡且可追溯</text><text x="1245" y="721" text-anchor="middle" fill="#496273" font-size="17">保留 Operation ID</text>
    </g>
  </g>
</svg>
