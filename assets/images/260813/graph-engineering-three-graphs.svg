<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Graph Engineering 的三種圖</title>
  <desc id="desc">比較執行控制圖、推理搜尋圖與知識脈絡圖的節點、邊與工程目標。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#17364d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#081b2c" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1600" height="980" fill="#f6f2e8"/>
  <text x="88" y="88" fill="#0c2335" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="44" font-weight="800">Graph Engineering 不是只有一種 Graph</text>
  <text x="88" y="134" fill="#526978" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24">同樣是 Node 與 Edge，語意、Runtime、風險與評估方法完全不同</text>

  <g filter="url(#shadow)" font-family="Arial, 'Noto Sans TC', sans-serif">
    <rect x="70" y="190" width="470" height="620" rx="30" fill="#fff" stroke="#244b66" stroke-width="3"/>
    <rect x="565" y="190" width="470" height="620" rx="30" fill="#fff" stroke="#789720" stroke-width="3"/>
    <rect x="1060" y="190" width="470" height="620" rx="30" fill="#fff" stroke="#3467ad" stroke-width="3"/>
  </g>

  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <rect x="70" y="190" width="470" height="105" rx="30" fill="#0c2335"/>
    <text x="305" y="235" text-anchor="middle" fill="#dfff42" font-size="28" font-weight="800">執行／控制圖</text>
    <text x="305" y="271" text-anchor="middle" fill="#dce5ea" font-size="19">Execution &amp; Control Graph</text>

    <rect x="565" y="190" width="470" height="105" rx="30" fill="#dfff42"/>
    <text x="800" y="235" text-anchor="middle" fill="#0c2335" font-size="28" font-weight="800">推理／搜尋圖</text>
    <text x="800" y="271" text-anchor="middle" fill="#304630" font-size="19">Reasoning &amp; Search Topology</text>

    <rect x="1060" y="190" width="470" height="105" rx="30" fill="#244b66"/>
    <text x="1295" y="235" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">知識／脈絡圖</text>
    <text x="1295" y="271" text-anchor="middle" fill="#dfff42" font-size="19">Knowledge &amp; Context Graph</text>
  </g>

  <g fill="none" stroke="#17364d" stroke-width="4" marker-end="url(#arrow)">
    <path d="M145 420H225"/><path d="M305 420H385"/><path d="M465 420V530H385"/>
    <path d="M700 385L780 345"/><path d="M700 385L780 425"/><path d="M700 385L780 505"/>
    <path d="M845 345L930 425"/><path d="M845 425H930"/><path d="M845 505L930 425"/>
  </g>
  <g stroke="#3467ad" stroke-width="3" fill="none">
    <path d="M1155 390L1270 345L1415 400L1335 505L1190 540L1155 390M1270 345L1335 505M1415 400L1190 540M1155 390L1335 505M1270 345L1190 540"/>
  </g>

  <g font-family="Arial, 'Noto Sans TC', sans-serif" font-weight="800" text-anchor="middle">
    <rect x="105" y="380" width="120" height="80" rx="20" fill="#e0e7ea"/><text x="165" y="430" fill="#0c2335" font-size="20">Router</text>
    <rect x="245" y="380" width="120" height="80" rx="20" fill="#dfff42"/><text x="305" y="430" fill="#0c2335" font-size="20">Workers</text>
    <path d="M445 370l70 40v80l-70 40-70-40v-80z" fill="#f3b7a5"/><text x="445" y="458" fill="#542b23" font-size="20">Gate</text>
    <rect x="245" y="530" width="140" height="72" rx="20" fill="#244b66"/><text x="315" y="575" fill="#fff" font-size="19">Checkpoint</text>

    <circle cx="670" cy="385" r="34" fill="#0c2335"/><text x="670" y="393" fill="#fff" font-size="18">題目</text>
    <circle cx="810" cy="345" r="34" fill="#e0e7ea"/><circle cx="810" cy="425" r="34" fill="#dfff42"/><circle cx="810" cy="505" r="34" fill="#e0e7ea"/>
    <text x="810" y="352" fill="#0c2335" font-size="18">候選 A</text><text x="810" y="432" fill="#0c2335" font-size="18">候選 B</text><text x="810" y="512" fill="#0c2335" font-size="18">候選 C</text>
    <circle cx="960" cy="425" r="38" fill="#244b66"/><text x="960" y="432" fill="#fff" font-size="18">合併</text>

    <circle cx="1155" cy="390" r="45" fill="#0c2335"/><text x="1155" y="397" fill="#fff" font-size="18">企業</text>
    <circle cx="1270" cy="345" r="40" fill="#dfff42"/><text x="1270" y="352" fill="#0c2335" font-size="18">產品</text>
    <circle cx="1415" cy="400" r="44" fill="#e0e7ea"/><text x="1415" y="407" fill="#0c2335" font-size="18">人物</text>
    <circle cx="1335" cy="505" r="43" fill="#244b66"/><text x="1335" y="512" fill="#fff" font-size="18">事件</text>
    <circle cx="1190" cy="540" r="43" fill="#f3b7a5"/><text x="1190" y="547" fill="#542b23" font-size="18">來源</text>
  </g>

  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <text x="305" y="665" text-anchor="middle" fill="#0c2335" font-size="22" font-weight="800">工程問題</text>
    <text x="305" y="704" text-anchor="middle" fill="#526978" font-size="19">路由、並行、狀態、復原、權限</text>
    <text x="305" y="739" text-anchor="middle" fill="#526978" font-size="19">Checkpoint、HITL、Side effect</text>
    <text x="800" y="665" text-anchor="middle" fill="#0c2335" font-size="22" font-weight="800">工程問題</text>
    <text x="800" y="704" text-anchor="middle" fill="#526978" font-size="19">分支、評分、剪枝、回溯、合併</text>
    <text x="800" y="739" text-anchor="middle" fill="#526978" font-size="19">何時值得付出額外 Token 與延遲</text>
    <text x="1295" y="665" text-anchor="middle" fill="#0c2335" font-size="22" font-weight="800">工程問題</text>
    <text x="1295" y="704" text-anchor="middle" fill="#526978" font-size="19">實體、關係、社群、來源與時間</text>
    <text x="1295" y="739" text-anchor="middle" fill="#526978" font-size="19">抽取錯誤、衝突、查詢與更新</text>
  </g>

  <rect x="150" y="854" width="1300" height="72" rx="36" fill="#0c2335"/>
  <text x="800" y="898" text-anchor="middle" fill="#fff" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="23" font-weight="800">可組合，但不可混為一談：三種圖需要不同的資料模型、Runtime、Evals 與治理規則</text>
</svg>
