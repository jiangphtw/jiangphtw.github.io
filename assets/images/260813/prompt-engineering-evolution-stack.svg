<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Engineering 到 Graph Engineering 的五層演進</title>
  <desc id="desc">由下而上依序是 Prompt、Context、Harness、Loop 與 Graph Engineering，每一層控制的範圍逐步擴大。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#081b2c" flood-opacity=".13"/>
    </filter>
    <linearGradient id="graph" x1="0" x2="1">
      <stop offset="0" stop-color="#dfff42"/>
      <stop offset="1" stop-color="#b9e72e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="960" fill="#f6f2e8"/>
  <g opacity=".18" stroke="#1c3448" stroke-width="1">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M0 840H1600"/>
    <path d="M200 0V960M400 0V960M600 0V960M800 0V960M1000 0V960M1200 0V960M1400 0V960"/>
  </g>
  <text x="110" y="96" fill="#0c2335" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="44" font-weight="800">LLM 工程的控制範圍逐層向外擴張</text>
  <text x="110" y="142" fill="#486071" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="25">新層次不是取代舊層次，而是把它包進更大的可控系統</text>

  <g filter="url(#shadow)" font-family="Arial, 'Noto Sans TC', sans-serif">
    <rect x="110" y="190" width="1380" height="126" rx="28" fill="url(#graph)"/>
    <circle cx="190" cy="253" r="35" fill="#0c2335"/>
    <path d="M173 253h34M190 236v34" stroke="#dfff42" stroke-width="6" stroke-linecap="round"/>
    <text x="250" y="244" fill="#0c2335" font-size="34" font-weight="800">Graph Engineering</text>
    <text x="250" y="280" fill="#263c33" font-size="23">控制多個節點、Agent、驗證閘門與狀態轉移的拓撲</text>
    <text x="1240" y="263" fill="#0c2335" font-size="23" font-weight="700">整個系統</text>

    <rect x="160" y="330" width="1280" height="116" rx="25" fill="#0c2335"/>
    <circle cx="235" cy="388" r="31" fill="#dfff42"/>
    <path d="M221 388a14 14 0 1 1 14 14" fill="none" stroke="#0c2335" stroke-width="5" stroke-linecap="round"/>
    <path d="M235 402l-9-7m9 7l-3-11" stroke="#0c2335" stroke-width="4" stroke-linecap="round"/>
    <text x="290" y="380" fill="#fff" font-size="31" font-weight="800">Loop Engineering</text>
    <text x="290" y="414" fill="#c9d4dc" font-size="22">控制一次任務如何反覆執行、驗證、修正與停止</text>
    <text x="1200" y="396" fill="#dfff42" font-size="22" font-weight="700">任務週期</text>

    <rect x="210" y="460" width="1180" height="106" rx="23" fill="#24445c"/>
    <circle cx="280" cy="513" r="29" fill="#f6f2e8"/>
    <path d="M266 514h28M271 504h18M275 524h10" stroke="#24445c" stroke-width="4" stroke-linecap="round"/>
    <text x="330" y="506" fill="#fff" font-size="30" font-weight="800">Harness Engineering</text>
    <text x="330" y="539" fill="#d9e3e9" font-size="21">配置工具、檔案、沙箱、權限、記憶、追蹤與復原環境</text>
    <text x="1168" y="521" fill="#dfff42" font-size="21" font-weight="700">執行環境</text>

    <rect x="260" y="580" width="1080" height="98" rx="21" fill="#3c6480"/>
    <circle cx="325" cy="629" r="27" fill="#dfff42"/>
    <path d="M313 620h24v18h-24zM318 615h14" fill="none" stroke="#163349" stroke-width="4" stroke-linejoin="round"/>
    <text x="370" y="623" fill="#fff" font-size="29" font-weight="800">Context Engineering</text>
    <text x="370" y="654" fill="#e3ebef" font-size="20">挑選當次推論真正需要的高訊號 Token</text>
    <text x="1120" y="638" fill="#dfff42" font-size="20" font-weight="700">模型視窗</text>

    <rect x="310" y="692" width="980" height="92" rx="20" fill="#d7e0e5"/>
    <circle cx="370" cy="738" r="25" fill="#0c2335"/>
    <path d="M357 728h26M357 738h20M357 748h15" stroke="#dfff42" stroke-width="4" stroke-linecap="round"/>
    <text x="412" y="732" fill="#0c2335" font-size="28" font-weight="800">Prompt Engineering</text>
    <text x="412" y="761" fill="#3f5869" font-size="19">設計單次模型呼叫的指令、例子、格式與邊界</text>
    <text x="1090" y="746" fill="#0c2335" font-size="20" font-weight="700">單次呼叫</text>
  </g>

  <path d="M800 848V813" stroke="#0c2335" stroke-width="5" stroke-linecap="round"/>
  <path d="M786 827l14-14 14 14" fill="none" stroke="#0c2335" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="898" text-anchor="middle" fill="#0c2335" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24" font-weight="700">控制單位：輸出 → Token → 環境 → 迴圈 → 拓撲</text>
</svg>
