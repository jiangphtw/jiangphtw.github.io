<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Context Engineering 動態管線</title>
  <desc id="desc">從當前任務與候選資訊來源開始，經過檢索、授權、排序、壓縮與組裝後送入模型，再將輸出回寫到狀態、記憶與觀測系統。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#092033" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#17384f"/></marker>
    <marker id="limeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#a8ce27"/></marker>
  </defs>
  <rect width="1600" height="980" fill="#f6f2e8"/>
  <g opacity=".16" stroke="#244b66"><path d="M0 140H1600M0 280H1600M0 420H1600M0 560H1600M0 700H1600M0 840H1600"/><path d="M200 0V980M400 0V980M600 0V980M800 0V980M1000 0V980M1200 0V980M1400 0V980"/></g>
  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <text x="80" y="77" fill="#0c2335" font-size="43" font-weight="800">Context Pipeline：每次推論都重新選擇最佳資訊組合</text>
    <text x="80" y="120" fill="#4f6777" font-size="23">目標不是填滿 Context Window，而是在有限注意力預算內提高任務成功率</text>

    <g filter="url(#shadow)">
      <rect x="70" y="188" width="230" height="126" rx="25" fill="#0c2335"/>
      <circle cx="118" cy="231" r="23" fill="#dfff42"/><text x="118" y="239" text-anchor="middle" fill="#0c2335" font-size="21" font-weight="900">1</text>
      <text x="155" y="238" fill="#fff" font-size="27" font-weight="800">理解任務</text>
      <text x="105" y="281" fill="#cbd7df" font-size="19">Intent · Goal · Risk</text>

      <rect x="342" y="188" width="230" height="126" rx="25" fill="#244b66"/>
      <circle cx="390" cy="231" r="23" fill="#dfff42"/><text x="390" y="239" text-anchor="middle" fill="#0c2335" font-size="21" font-weight="900">2</text>
      <text x="427" y="238" fill="#fff" font-size="27" font-weight="800">選擇來源</text>
      <text x="377" y="281" fill="#d8e2e8" font-size="19">Docs · DB · Memory</text>

      <rect x="614" y="188" width="230" height="126" rx="25" fill="#3f6985"/>
      <circle cx="662" cy="231" r="23" fill="#dfff42"/><text x="662" y="239" text-anchor="middle" fill="#0c2335" font-size="21" font-weight="900">3</text>
      <text x="699" y="238" fill="#fff" font-size="27" font-weight="800">權限檢索</text>
      <text x="649" y="281" fill="#e1e9ed" font-size="19">ACL · Filter · Search</text>

      <rect x="886" y="188" width="230" height="126" rx="25" fill="#dfff42"/>
      <circle cx="934" cy="231" r="23" fill="#0c2335"/><text x="934" y="239" text-anchor="middle" fill="#dfff42" font-size="21" font-weight="900">4</text>
      <text x="971" y="238" fill="#0c2335" font-size="27" font-weight="800">去重排序</text>
      <text x="921" y="281" fill="#304532" font-size="19">Rerank · 時效 · 權威</text>

      <rect x="1158" y="188" width="230" height="126" rx="25" fill="#c9ef42"/>
      <circle cx="1206" cy="231" r="23" fill="#0c2335"/><text x="1206" y="239" text-anchor="middle" fill="#dfff42" font-size="21" font-weight="900">5</text>
      <text x="1243" y="238" fill="#0c2335" font-size="27" font-weight="800">轉換壓縮</text>
      <text x="1193" y="281" fill="#304532" font-size="19">Dedup · Summarize</text>
    </g>
    <path d="M300 251h31M572 251h31M844 251h31M1116 251h31" stroke="#17384f" stroke-width="5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="225" y="405" width="500" height="315" rx="34" fill="#fff" stroke="#244b66" stroke-width="3"/>
      <text x="475" y="458" text-anchor="middle" fill="#0c2335" font-size="31" font-weight="800">6 · 組裝 Working Context</text>
      <rect x="272" y="490" width="406" height="43" rx="15" fill="#0c2335"/><text x="475" y="519" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">高優先級指令與安全邊界</text>
      <rect x="272" y="547" width="406" height="43" rx="15" fill="#244b66"/><text x="475" y="576" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">當前目標、輸入與成功條件</text>
      <rect x="272" y="604" width="406" height="43" rx="15" fill="#dfff42"/><text x="475" y="633" text-anchor="middle" fill="#0c2335" font-size="19" font-weight="700">精選證據、來源與工作狀態</text>
      <rect x="272" y="661" width="406" height="32" rx="13" fill="#dce5e9"/><text x="475" y="683" text-anchor="middle" fill="#496273" font-size="17" font-weight="700">必要工具介面與輸出契約</text>

      <rect x="890" y="420" width="280" height="280" rx="42" fill="#0c2335"/>
      <path d="M953 500l77-54 77 54v105l-77 54-77-54z" fill="none" stroke="#dfff42" stroke-width="8"/>
      <circle cx="1030" cy="553" r="37" fill="#dfff42"/>
      <text x="1030" y="748" text-anchor="middle" fill="#0c2335" font-size="28" font-weight="800">7 · 模型推論／工具行動</text>
    </g>
    <path d="M725 560h145" stroke="#17384f" stroke-width="7" marker-end="url(#arrow)"/>
    <path d="M1273 314v78c0 18-15 32-32 32h-54" fill="none" stroke="#17384f" stroke-width="5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="330" y="810" width="940" height="105" rx="31" fill="#e2e9ec"/>
      <circle cx="392" cy="862" r="27" fill="#0c2335"/><text x="392" y="871" text-anchor="middle" fill="#dfff42" font-size="23" font-weight="900">8</text>
      <text x="438" y="852" fill="#0c2335" font-size="27" font-weight="800">觀測與回寫</text>
      <text x="438" y="886" fill="#4f6777" font-size="20">更新 Workflow State · 寫入合格 Memory · 保存 Provenance · 收集 Evals</text>
    </g>
    <path d="M1030 700v83c0 15-12 27-27 27" fill="none" stroke="#a8ce27" stroke-width="6" marker-end="url(#limeArrow)"/>
    <path d="M330 862H183c-24 0-43-19-43-43V370c0-28 23-51 51-51" fill="none" stroke="#a8ce27" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#limeArrow)"/>
    <text x="65" y="575" transform="rotate(-90 65 575)" fill="#68851b" font-size="19" font-weight="800">下一次推論重新建構 Context</text>
  </g>
</svg>
