<svg width="1700" height="860" viewBox="0 0 1700 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1700" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4E8"/>
      <stop offset="1" stop-color="#EEF8FF"/>
    </linearGradient>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#8EA5C8"/>
    </marker>
    <style>
      .title { font: 700 62px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #1A3157; }
      .subtitle { font: 400 24px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #60769A; }
      .label { font: 700 26px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #1A3157; }
      .body { font: 400 22px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #60769A; }
    </style>
  </defs>

  <rect width="1700" height="860" rx="28" fill="url(#bg)"/>
  <text x="86" y="106" class="title">CNN 的資料流</text>
  <text x="86" y="164" class="subtitle">我會把它理解成：影像先經過卷積和池化，把局部模式變成更高階的特徵圖，再做分類。</text>

  <rect x="86" y="300" width="230" height="260" rx="28" fill="#FFFFFF" stroke="#FFC56E" stroke-width="4"/>
  <rect x="408" y="300" width="230" height="260" rx="28" fill="#FFFFFF" stroke="#FFC56E" stroke-width="4"/>
  <rect x="730" y="300" width="230" height="260" rx="28" fill="#FFFFFF" stroke="#FFC56E" stroke-width="4"/>
  <rect x="1052" y="300" width="230" height="260" rx="28" fill="#FFFFFF" stroke="#FFC56E" stroke-width="4"/>
  <rect x="1374" y="300" width="230" height="260" rx="28" fill="#FFFFFF" stroke="#FFC56E" stroke-width="4"/>

  <text x="201" y="372" text-anchor="middle" class="label">輸入影像</text>
  <text x="201" y="426" text-anchor="middle" class="body">28 x 28 灰階圖</text>
  <text x="201" y="470" text-anchor="middle" class="body">保留空間位置</text>

  <text x="523" y="372" text-anchor="middle" class="label">卷積層</text>
  <text x="523" y="426" text-anchor="middle" class="body">先抓邊緣</text>
  <text x="523" y="470" text-anchor="middle" class="body">紋理和局部形狀</text>

  <text x="845" y="372" text-anchor="middle" class="label">池化層</text>
  <text x="845" y="426" text-anchor="middle" class="body">縮小尺寸</text>
  <text x="845" y="470" text-anchor="middle" class="body">保留主要訊號</text>

  <text x="1167" y="372" text-anchor="middle" class="label">特徵圖</text>
  <text x="1167" y="426" text-anchor="middle" class="body">局部模式被組成</text>
  <text x="1167" y="470" text-anchor="middle" class="body">更高階表示</text>

  <text x="1489" y="372" text-anchor="middle" class="label">分類器</text>
  <text x="1489" y="426" text-anchor="middle" class="body">Flatten 後接</text>
  <text x="1489" y="470" text-anchor="middle" class="body">全連接輸出</text>

  <line x1="324" y1="430" x2="398" y2="430" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="646" y1="430" x2="720" y2="430" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="968" y1="430" x2="1042" y2="430" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="1290" y1="430" x2="1364" y2="430" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="270" y="676" width="1160" height="98" rx="24" fill="#E7F7F2" stroke="#8AD4BE" stroke-width="4"/>
  <text x="850" y="736" text-anchor="middle" class="label">和純 MLP 最大的差別是：CNN 不會一開始就把圖片攤平，而是先保留空間結構。</text>
</svg>
