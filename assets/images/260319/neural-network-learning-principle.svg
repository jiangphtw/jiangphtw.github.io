<svg width="1800" height="980" viewBox="0 0 1800 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1800" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4E8"/>
      <stop offset="1" stop-color="#EEF8FF"/>
    </linearGradient>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#8EA5C8"/>
    </marker>
    <style>
      .title { font: 700 64px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #1A3157; }
      .subtitle { font: 400 24px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #60769A; }
      .cardtitle { font: 700 28px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #1A3157; }
      .body { font: 400 22px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #60769A; }
      .note { font: 700 26px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #23786D; }
    </style>
  </defs>

  <rect width="1800" height="980" rx="28" fill="url(#bg)"/>

  <text x="86" y="106" class="title">神經網路怎麼學</text>
  <text x="86" y="164" class="subtitle">我會把訓練流程看成：先猜答案，再用錯誤回頭修正參數。</text>

  <g>
    <rect x="86" y="290" width="292" height="330" rx="28" fill="#FFFFFF" stroke="#B9CDF5" stroke-width="4"/>
    <text x="232" y="366" text-anchor="middle" class="cardtitle">1. 輸入資料</text>
    <text x="232" y="428" text-anchor="middle" class="body">影像、文字、數字</text>
    <text x="232" y="474" text-anchor="middle" class="body">先轉成張量</text>
    <text x="232" y="520" text-anchor="middle" class="body">送進輸入層</text>
  </g>

  <g>
    <rect x="424" y="290" width="292" height="330" rx="28" fill="#FFFFFF" stroke="#B9CDF5" stroke-width="4"/>
    <text x="570" y="366" text-anchor="middle" class="cardtitle">2. 前向計算</text>
    <text x="570" y="428" text-anchor="middle" class="body">權重與偏差做線性組合</text>
    <text x="570" y="474" text-anchor="middle" class="body">激活函數做非線性轉換</text>
    <text x="570" y="520" text-anchor="middle" class="body">得到目前預測</text>
  </g>

  <g>
    <rect x="762" y="290" width="292" height="330" rx="28" fill="#FFFFFF" stroke="#FFC56E" stroke-width="4"/>
    <text x="908" y="366" text-anchor="middle" class="cardtitle">3. 損失函數</text>
    <text x="908" y="428" text-anchor="middle" class="body">拿預測和正確答案比較</text>
    <text x="908" y="474" text-anchor="middle" class="body">錯得越多</text>
    <text x="908" y="520" text-anchor="middle" class="body">損失就越大</text>
  </g>

  <g>
    <rect x="1100" y="290" width="292" height="330" rx="28" fill="#FFFFFF" stroke="#98E0CE" stroke-width="4"/>
    <text x="1246" y="366" text-anchor="middle" class="cardtitle">4. 反向傳播</text>
    <text x="1246" y="428" text-anchor="middle" class="body">把誤差往回傳</text>
    <text x="1246" y="474" text-anchor="middle" class="body">算每一層</text>
    <text x="1246" y="520" text-anchor="middle" class="body">該修多少</text>
  </g>

  <g>
    <rect x="1438" y="290" width="292" height="330" rx="28" fill="#FFFFFF" stroke="#98E0CE" stroke-width="4"/>
    <text x="1584" y="366" text-anchor="middle" class="cardtitle">5. 更新參數</text>
    <text x="1584" y="428" text-anchor="middle" class="body">優化器調整權重</text>
    <text x="1584" y="474" text-anchor="middle" class="body">再看下一批資料</text>
    <text x="1584" y="520" text-anchor="middle" class="body">很多輪重複</text>
  </g>

  <line x1="386" y1="455" x2="414" y2="455" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="724" y1="455" x2="752" y2="455" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="1062" y1="455" x2="1090" y2="455" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="1400" y1="455" x2="1428" y2="455" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="310" y="760" width="1180" height="118" rx="26" fill="#E7F7F2" stroke="#8AD4BE" stroke-width="4"/>
  <text x="900" y="826" text-anchor="middle" class="note">整個流程不會只跑一次，而是很多個 batch、很多個 epoch 一直重複。</text>
</svg>
