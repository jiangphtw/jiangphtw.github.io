<svg width="1700" height="980" viewBox="0 0 1700 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1700" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4E8"/>
      <stop offset="1" stop-color="#EEF8FF"/>
    </linearGradient>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#8EA5C8"/>
    </marker>
    <style>
      .title { font: 700 62px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #1A3157; }
      .subtitle { font: 400 24px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #60769A; }
      .label { font: 700 24px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #1A3157; }
      .body { font: 400 20px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #60769A; }
      .hint { font: 700 24px 'Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #204C74; }
    </style>
  </defs>

  <rect width="1700" height="980" rx="28" fill="url(#bg)"/>
  <text x="64" y="104" class="title">PyTorch 實作地圖</text>
  <text x="64" y="164" class="subtitle">我這篇文章的正式操作路徑是：clone Teaching-Resource，進 ai 啟用 .venv，再進 Neural-Network 跑三個範例。</text>

  <rect x="70" y="270" width="250" height="170" rx="26" fill="#FFFFFF" stroke="#B9CDF5" stroke-width="4"/>
  <rect x="380" y="270" width="250" height="170" rx="26" fill="#FFFFFF" stroke="#B9CDF5" stroke-width="4"/>
  <rect x="690" y="270" width="250" height="170" rx="26" fill="#FFFFFF" stroke="#B9CDF5" stroke-width="4"/>
  <rect x="1000" y="270" width="250" height="170" rx="26" fill="#FFFFFF" stroke="#FFC56E" stroke-width="4"/>
  <rect x="1310" y="270" width="250" height="170" rx="26" fill="#FFFFFF" stroke="#98E0CE" stroke-width="4"/>

  <text x="195" y="332" text-anchor="middle" class="label">1. clone repo</text>
  <text x="195" y="382" text-anchor="middle" class="body">Teaching-Resource</text>

  <text x="505" y="332" text-anchor="middle" class="label">2. 進入 ai</text>
  <text x="505" y="382" text-anchor="middle" class="body">教材主目錄</text>

  <text x="815" y="332" text-anchor="middle" class="label">3. 啟用 .venv</text>
  <text x="815" y="382" text-anchor="middle" class="body">PowerShell 啟用環境</text>

  <text x="1125" y="332" text-anchor="middle" class="label">4. 進入</text>
  <text x="1125" y="368" text-anchor="middle" class="label" style="font-size:22px;">Neural-Network</text>
  <text x="1125" y="406" text-anchor="middle" class="body">範例腳本都在這裡</text>

  <text x="1435" y="332" text-anchor="middle" class="label">5. 執行腳本</text>
  <text x="1435" y="382" text-anchor="middle" class="body">NN、CNN、RNN</text>

  <line x1="330" y1="355" x2="370" y2="355" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="640" y1="355" x2="680" y2="355" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="950" y1="355" x2="990" y2="355" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="1260" y1="355" x2="1300" y2="355" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <line x1="1435" y1="440" x2="1435" y2="550" stroke="#8EA5C8" stroke-width="8" stroke-linecap="round"/>
  <line x1="1435" y1="550" x2="1120" y2="590" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round"/>
  <line x1="1435" y1="550" x2="1390" y2="590" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round"/>
  <line x1="1435" y1="550" x2="1660" y2="590" stroke="#8EA5C8" stroke-width="6" stroke-linecap="round"/>

  <rect x="960" y="590" width="320" height="180" rx="26" fill="#FFFFFF" stroke="#B9CDF5" stroke-width="4"/>
  <rect x="1230" y="590" width="320" height="180" rx="26" fill="#FFFFFF" stroke="#FFC56E" stroke-width="4"/>
  <rect x="1500" y="590" width="180" height="180" rx="26" fill="#FFFFFF" stroke="#98E0CE" stroke-width="4"/>

  <text x="1120" y="652" text-anchor="middle" class="label" style="font-size:22px;">nn_example.py</text>
  <text x="1120" y="704" text-anchor="middle" class="body">MNIST + MLP</text>

  <text x="1390" y="652" text-anchor="middle" class="label" style="font-size:22px;">cnn_example.py</text>
  <text x="1390" y="704" text-anchor="middle" class="body">MNIST + CNN</text>

  <text x="1590" y="650" text-anchor="middle" class="label" style="font-size:16px;">rnn_example.py</text>
  <text x="1590" y="704" text-anchor="middle" class="body">char RNN</text>

  <rect x="220" y="844" width="1260" height="92" rx="24" fill="#E7F7F2" stroke="#8AD4BE" stroke-width="4"/>
  <text x="850" y="900" text-anchor="middle" class="hint">我這篇文章只講一條正式操作路徑：先 clone repo，再進 ai 啟用 venv，最後進 Neural-Network 跑腳本。</text>
</svg>
