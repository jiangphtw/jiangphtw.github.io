<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="28" fill="#F8FAFC"/>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="120" fill="#183153" font-size="58" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">工業 5.0 常見名詞的關係</text>
  <text x="80" y="175" fill="#5B7090" font-size="28" font-weight="500" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">IoT 讓資料進來，CPS 形成閉環，Digital Twin 先理解設備，Human Digital Twin 再把人放進模型。</text>

  <rect x="150" y="590" width="280" height="160" rx="28" fill="#F0F9FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="290" y="645" text-anchor="middle" fill="#2563EB" font-size="34" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">IoT</text>
  <text x="290" y="688" text-anchor="middle" fill="#183153" font-size="28" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">感測與連線</text>
  <text x="290" y="723" text-anchor="middle" fill="#5B7090" font-size="22" font-weight="500" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">設備持續送資料</text>

  <rect x="500" y="430" width="320" height="190" rx="30" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="4"/>
  <text x="660" y="490" text-anchor="middle" fill="#4F46E5" font-size="34" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">CPS</text>
  <text x="660" y="535" text-anchor="middle" fill="#183153" font-size="28" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">感知、計算、控制</text>
  <text x="660" y="572" text-anchor="middle" fill="#5B7090" font-size="22" font-weight="500" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">讓數位系統能回頭影響現場</text>

  <rect x="920" y="250" width="260" height="170" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="1050" y="315" text-anchor="middle" fill="#F97316" font-size="32" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">Digital Twin</text>
  <text x="1050" y="360" text-anchor="middle" fill="#183153" font-size="26" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">設備與產線的</text>
  <text x="1050" y="396" text-anchor="middle" fill="#183153" font-size="26" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">數位分身</text>

  <rect x="1240" y="250" width="260" height="170" rx="28" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="4"/>
  <text x="1370" y="315" text-anchor="middle" fill="#0F766E" font-size="30" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">Human</text>
  <text x="1370" y="352" text-anchor="middle" fill="#0F766E" font-size="30" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">Digital Twin</text>
  <text x="1370" y="396" text-anchor="middle" fill="#183153" font-size="24" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">把人的狀態</text>
  <text x="1370" y="430" text-anchor="middle" fill="#183153" font-size="24" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">也納入模型</text>

  <rect x="1080" y="560" width="360" height="170" rx="30" fill="#FFFFFF" stroke="#D8E2F0" stroke-width="4"/>
  <text x="1260" y="620" text-anchor="middle" fill="#183153" font-size="30" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">工業 5.0 的新問題</text>
  <text x="1260" y="664" text-anchor="middle" fill="#5B7090" font-size="24" font-weight="500" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">不只理解機器</text>
  <text x="1260" y="698" text-anchor="middle" fill="#5B7090" font-size="24" font-weight="500" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">也要理解人與情境</text>

  <path d="M430 670L500 560" stroke="#7DD3FC" stroke-width="8" stroke-linecap="round"/>
  <path d="M806 510L920 350" stroke="#A5B4FC" stroke-width="8" stroke-linecap="round"/>
  <path d="M1180 335H1240" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
  <path d="M1160 420L1200 560" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  <path d="M1360 420L1320 560" stroke="#14B8A6" stroke-width="8" stroke-linecap="round"/>

  <text x="860" y="510" fill="#5B7090" font-size="22" font-weight="600" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">資料進來後</text>
  <text x="785" y="542" fill="#5B7090" font-size="22" font-weight="600" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">形成可回饋的閉環</text>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
  </defs>
</svg>
