<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="28" fill="#F8FAFC"/>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="120" fill="#183153" font-size="58" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">CNN 為什麼適合影像</text>
  <text x="80" y="175" fill="#5B7090" font-size="28" font-weight="500" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">我會把它理解成：先抓局部，再逐層組成更抽象的整體特徵。</text>

  <rect x="120" y="270" width="470" height="500" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <text x="355" y="330" text-anchor="middle" fill="#183153" font-size="34" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">輸入影像</text>
  <rect x="185" y="385" width="340" height="280" rx="20" fill="#E2E8F0"/>
  <path d="M230 440H480" stroke="#94A3B8" stroke-width="16" stroke-linecap="round"/>
  <path d="M230 520H430" stroke="#94A3B8" stroke-width="16" stroke-linecap="round"/>
  <path d="M270 600H480" stroke="#94A3B8" stroke-width="16" stroke-linecap="round"/>
  <rect x="290" y="470" width="120" height="120" rx="16" fill="none" stroke="#F97316" stroke-width="10"/>
  <text x="355" y="720" text-anchor="middle" fill="#5B7090" font-size="22" font-weight="500" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">先在局部區域找邊緣、紋理、形狀</text>

  <path d="M620 500H780" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
  <path d="M760 475L805 500L760 525" fill="#94A3B8"/>

  <rect x="830" y="270" width="650" height="500" rx="30" fill="#F0F9FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="1155" y="330" text-anchor="middle" fill="#2563EB" font-size="34" font-weight="800" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">CNN 的直覺</text>
  <rect x="910" y="390" width="470" height="80" rx="18" fill="#FFFFFF"/>
  <rect x="910" y="495" width="470" height="80" rx="18" fill="#FFFFFF"/>
  <rect x="910" y="600" width="470" height="80" rx="18" fill="#FFFFFF"/>
  <text x="950" y="440" fill="#183153" font-size="25" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">局部感受野：先看小區域，不是整張圖一起看</text>
  <text x="950" y="545" fill="#183153" font-size="25" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">權重共享：同一組濾波器可在不同位置重複用</text>
  <text x="950" y="650" fill="#183153" font-size="25" font-weight="700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">逐層抽特徵：從邊緣走到形狀，再到整體概念</text>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
  </defs>
</svg>
