<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="監督式二元分類 vs PU Learning（只有正例與未知）的差異示意圖">
  <title>監督式二元分類 vs PU Learning</title>
  <defs>
    <style>
      .title {
        font: 700 24px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        fill: #0f172a;
      }
      .label {
        font: 600 15px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        fill: #111827;
      }
      .body {
        font: 600 13px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        fill: #1f2937;
      }
      .small {
        font: 12px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        fill: #374151;
      }
      .muted { fill: #6b7280; }
      .center { text-anchor: middle; dominant-baseline: middle; }
      .panel { fill: #f8fafc; stroke: #d1d5db; stroke-width: 2; }
      .pill { stroke-width: 2.5; }
      .pos { fill: #dbeafe; stroke: #2563eb; }
      .neg { fill: #dcfce7; stroke: #16a34a; }
      .unknown { fill: #fef3c7; stroke: #d97706; }
      .curve { stroke: #d1d5db; stroke-width: 2.5; fill: none; }
      .arrow { stroke: #6b7280; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="450" fill="#ffffff"/>
  <text x="480" y="50" class="title center">監督式二元分類 vs PU Learning</text>

  <rect x="55" y="88" width="390" height="304" rx="18" class="panel"/>
  <text x="250" y="125" class="label center">監督式二元分類（有正例也有真實負例）</text>
  <text x="250" y="150" class="small center">資料標籤：P=1、N=0（兩者都是真的）</text>

  <rect x="98" y="184" width="132" height="52" rx="16" class="pill pos"/>
  <text x="164" y="210" class="label center">P 正例</text>
  <text x="164" y="246" class="small muted center">例如：確定通過</text>

  <rect x="270" y="184" width="132" height="52" rx="16" class="pill neg"/>
  <text x="336" y="210" class="label center">N 負例</text>
  <text x="336" y="246" class="small muted center">例如：確定不通過</text>

  <path d="M135 282 C162 312, 222 312, 250 282" class="curve"/>
  <path d="M257 282 C285 312, 345 312, 372 282" class="curve"/>
  <text x="250" y="344" class="small center">模型直接學 P vs N 的邊界</text>

  <path d="M455 240 L505 240" class="arrow"/>
  <text x="480" y="220" class="small muted center">對照</text>

  <rect x="515" y="88" width="390" height="304" rx="18" class="panel"/>
  <text x="710" y="125" class="label center">PU Learning（只有正例 + 未標註）</text>
  <text x="710" y="150" class="small center">資料標籤：P=1、U=未知（U 不是 0）</text>

  <rect x="558" y="184" width="132" height="52" rx="16" class="pill pos"/>
  <text x="624" y="210" class="label center">P 正例</text>
  <text x="624" y="246" class="small muted center">例如：確定通過</text>

  <rect x="730" y="184" width="132" height="52" rx="16" class="pill unknown"/>
  <text x="796" y="210" class="label center">U 未標註</text>
  <text x="796" y="246" class="small muted center">例如：沒有紀錄</text>

  <rect x="708" y="262" width="176" height="78" rx="18" class="pill unknown" opacity="0.6"/>
  <rect x="724" y="277" width="60" height="48" rx="14" class="pill pos" opacity="0.92"/>
  <rect x="804" y="277" width="60" height="48" rx="14" class="pill neg" opacity="0.82"/>
  <text x="796" y="356" class="small muted center">
    <tspan x="796" dy="0">U 裡面混著「潛在正例」</tspan>
    <tspan x="796" dy="18">與「真正負例」</tspan>
  </text>
</svg>
