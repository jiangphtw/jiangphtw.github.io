<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">為什麼需要在生成前先檢索資料</title>
  <desc id="desc">比較只靠模型記憶回答與先檢索外部知識再回答的差異。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d9dde8" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 60px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; }
      .subtitle { font: 400 26px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
      .head { font: 700 34px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .line { font: 400 24px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>

  <text x="88" y="118" class="title">為什麼 LLM 回答前要先檢索資料</text>
  <text x="88" y="170" class="subtitle">只靠模型記憶，很容易遇到知識過時與缺少私有資料的問題。</text>

  <g filter="url(#shadow)">
    <rect x="120" y="280" width="560" height="360" rx="36" fill="#fff6ef" stroke="#ffb17a" stroke-width="4"/>
    <rect x="920" y="280" width="560" height="360" rx="36" fill="#eef6ff" stroke="#8cb9ff" stroke-width="4"/>
  </g>

  <text x="400" y="376" class="head">只靠模型記憶</text>
  <text x="400" y="440" class="line">不知道你的最新內部文件</text>
  <text x="400" y="478" class="line">可能用過時知識回答</text>
  <text x="400" y="516" class="line">看起來合理，但未必有來源</text>

  <text x="1200" y="376" class="head">先檢索，再生成</text>
  <text x="1200" y="440" class="line">先找外部知識與私有資料</text>
  <text x="1200" y="478" class="line">把相關內容補進上下文</text>
  <text x="1200" y="516" class="line">回答比較能連回來源</text>
</svg>
