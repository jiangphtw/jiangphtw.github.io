<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">資料分析流程</title>
  <desc id="desc">五個步驟卡片，從問題、指標、切分、驗證到結論。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d9dde8" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#c8d6ef"/>
    </marker>
    <style>
      .title { font: 700 60px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; }
      .subtitle { font: 400 26px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
      .badge { font: 700 22px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #ffffff; text-anchor: middle; }
      .card-title { font: 700 30px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .card-line { font: 400 22px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>

  <text x="88" y="118" class="title">從問題到結論的資料分析流程</text>
  <text x="88" y="170" class="subtitle">不要直接開圖表工具，先把問題、指標和比較邏輯整理清楚。</text>

  <line x1="268" y1="438" x2="1334" y2="438" stroke="#dbe4f3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="300" width="220" height="240" rx="30" fill="#ffffff" stroke="#cfd9ee" stroke-width="4"/>
    <rect x="380" y="300" width="220" height="240" rx="30" fill="#fff6ef" stroke="#ffb17a" stroke-width="4"/>
    <rect x="660" y="300" width="220" height="240" rx="30" fill="#fff6ef" stroke="#ffb17a" stroke-width="4"/>
    <rect x="940" y="300" width="220" height="240" rx="30" fill="#eef6ff" stroke="#8cb9ff" stroke-width="4"/>
    <rect x="1220" y="300" width="220" height="240" rx="30" fill="#eefaf7" stroke="#77cdb5" stroke-width="4"/>
  </g>

  <rect x="160" y="260" width="100" height="48" rx="18" fill="#98a9c8"/>
  <rect x="440" y="260" width="100" height="48" rx="18" fill="#ffb17a"/>
  <rect x="720" y="260" width="100" height="48" rx="18" fill="#ffb17a"/>
  <rect x="1000" y="260" width="100" height="48" rx="18" fill="#8cb9ff"/>
  <rect x="1280" y="260" width="100" height="48" rx="18" fill="#77cdb5"/>

  <text x="210" y="292" class="badge">STEP 1</text>
  <text x="490" y="292" class="badge">STEP 2</text>
  <text x="770" y="292" class="badge">STEP 3</text>
  <text x="1050" y="292" class="badge">STEP 4</text>
  <text x="1330" y="292" class="badge">STEP 5</text>

  <text x="210" y="388" class="card-title">定義問題</text>
  <text x="210" y="438" class="card-line">你要解釋什麼變化</text>
  <text x="210" y="472" class="card-line">分析單位是誰</text>

  <text x="490" y="388" class="card-title">定義指標</text>
  <text x="490" y="438" class="card-line">營收、轉換率</text>
  <text x="490" y="472" class="card-line">平均值或分布</text>

  <text x="770" y="388" class="card-title">切分比較</text>
  <text x="770" y="438" class="card-line">依時間、通路</text>
  <text x="770" y="472" class="card-line">地區或類別拆開看</text>

  <text x="1050" y="388" class="card-title">驗證異常</text>
  <text x="1050" y="438" class="card-line">檢查離群值</text>
  <text x="1050" y="472" class="card-line">確認不是資料錯</text>

  <text x="1330" y="388" class="card-title">整理結論</text>
  <text x="1330" y="438" class="card-line">用一句話說清楚</text>
  <text x="1330" y="472" class="card-line">差異在哪、為什麼</text>
</svg>
