<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">資料儲存選型情境</title>
  <desc id="desc">四張情境卡片，說明何時選 CSV/Parquet、SQLite、PostgreSQL、zvec。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d9dde8" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 60px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; }
      .subtitle { font: 400 26px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
      .badge { font: 700 22px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #ffffff; text-anchor: middle; }
      .card-title { font: 700 30px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .line { font: 400 22px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="88" y="118" class="title">不同場景下，合理的資料儲存選型</text>
  <text x="88" y="170" class="subtitle">不是選最強的，而是選最符合目前工作負載與維運成本的。</text>

  <g filter="url(#shadow)">
    <rect x="90" y="280" width="330" height="300" rx="32" fill="#ffffff" stroke="#ffb17a" stroke-width="4"/>
    <rect x="450" y="280" width="330" height="300" rx="32" fill="#ffffff" stroke="#8cb9ff" stroke-width="4"/>
    <rect x="810" y="280" width="330" height="300" rx="32" fill="#ffffff" stroke="#77cdb5" stroke-width="4"/>
    <rect x="1170" y="280" width="330" height="300" rx="32" fill="#ffffff" stroke="#c39cff" stroke-width="4"/>
  </g>

  <rect x="175" y="242" width="160" height="52" rx="20" fill="#ff9b66"/>
  <rect x="535" y="242" width="160" height="52" rx="20" fill="#6ea5ff"/>
  <rect x="895" y="242" width="160" height="52" rx="20" fill="#36b58f"/>
  <rect x="1255" y="242" width="160" height="52" rx="20" fill="#b186ff"/>

  <text x="255" y="276" class="badge">情境 1</text>
  <text x="615" y="276" class="badge">情境 2</text>
  <text x="975" y="276" class="badge">情境 3</text>
  <text x="1335" y="276" class="badge">情境 4</text>

  <text x="255" y="370" class="card-title">交換或分析資料集</text>
  <text x="255" y="430" class="line">CSV 給人看</text>
  <text x="255" y="466" class="line">Parquet 給大量分析</text>

  <text x="615" y="370" class="card-title">本機工具 / 小專案</text>
  <text x="615" y="430" class="line">優先考慮 SQLite</text>
  <text x="615" y="466" class="line">夠穩又不重</text>

  <text x="975" y="370" class="card-title">正式後端 / SaaS</text>
  <text x="975" y="430" class="line">優先考慮 PostgreSQL</text>
  <text x="975" y="466" class="line">多人協作與 transaction</text>

  <text x="1335" y="370" class="card-title">RAG / 向量檢索</text>
  <text x="1335" y="430" class="line">優先考慮 zvec</text>
  <text x="1335" y="466" class="line">主打 similarity search</text>
</svg>
