<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">資料清理重點</title>
  <desc id="desc">左側列出原始資料常見問題，中間是清理步驟，右側是清理後資料應具備的特性。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ef" />
      <stop offset="100%" stop-color="#f4f8ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d9dde8" flood-opacity="0.45" />
    </filter>
    <style>
      .title { font: 700 62px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; }
      .subtitle { font: 400 26px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
      .panel-title { font: 700 34px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .chip { font: 700 24px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .mid { font: 700 30px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #ff7d48; text-anchor: middle; }
      .right-line { font: 400 25px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ff9b66" />
    </marker>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)" />

  <text x="88" y="118" class="title">資料清理是在統一定義，不只是整理表格</text>
  <text x="88" y="170" class="subtitle">真正的目標是讓資料可查詢、可比較、可重跑，而且不同人會得到同樣結論。</text>

  <g filter="url(#shadow)">
    <rect x="100" y="250" width="420" height="520" rx="34" fill="#ffffff" stroke="#ffc291" stroke-width="5" />
    <rect x="616" y="250" width="340" height="520" rx="34" fill="#fff7f1" stroke="#ffb27b" stroke-width="5" />
    <rect x="1052" y="250" width="448" height="520" rx="34" fill="#ffffff" stroke="#a8c3ff" stroke-width="5" />
  </g>

  <text x="310" y="320" class="panel-title">原始資料常見問題</text>
  <rect x="156" y="366" width="308" height="60" rx="20" fill="#fff0e6" />
  <rect x="156" y="446" width="308" height="60" rx="20" fill="#fff0e6" />
  <rect x="156" y="526" width="308" height="60" rx="20" fill="#fff0e6" />
  <rect x="156" y="606" width="308" height="60" rx="20" fill="#fff0e6" />

  <text x="310" y="405" class="chip">缺失值與空白欄位</text>
  <text x="310" y="485" class="chip">重複列與重複事件</text>
  <text x="310" y="565" class="chip">時間格式與時區不一</text>
  <text x="310" y="645" class="chip">類別值與命名不一致</text>

  <text x="786" y="320" class="panel-title">清理工作</text>
  <text x="786" y="410" class="mid">偵測與標記缺值</text>
  <text x="786" y="475" class="mid">轉型別與統一格式</text>
  <text x="786" y="540" class="mid">去重複與定義主鍵</text>
  <text x="786" y="605" class="mid">重塑欄位與寫清規則</text>

  <line x1="520" y1="510" x2="610" y2="510" stroke="#ff9b66" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" />
  <line x1="958" y1="510" x2="1044" y2="510" stroke="#ff9b66" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" />

  <text x="1276" y="320" class="panel-title">清理後資料應具備</text>
  <text x="1120" y="402" class="right-line">欄位型別固定</text>
  <text x="1120" y="452" class="right-line">主鍵能追蹤來源</text>
  <text x="1120" y="502" class="right-line">時間格式一致</text>
  <text x="1120" y="552" class="right-line">缺值定義明確</text>
  <text x="1120" y="602" class="right-line">規則可以重跑</text>
  <text x="1120" y="652" class="right-line">別人也看得懂欄位</text>
</svg>
