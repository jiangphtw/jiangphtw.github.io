<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="72" y1="56" x2="1208" y2="664" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#FFF5EB"/>
    </linearGradient>
    <style>
      .title { font: 700 54px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #18243D; }
      .subtitle { font: 400 24px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #58657B; }
      .tag { font: 700 18px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #FF7A59; }
      .card-title { font: 700 28px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #18243D; }
      .card-text { font: 400 19px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #53627C; }
      .core-tag { font: 700 22px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #FFD9C6; }
      .core-title { font: 700 30px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #FFFFFF; }
      .core-text { font: 500 22px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #E7F0FF; }
      .bottom { font: 700 24px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #18243D; }
    </style>
    <filter id="shadow" x="0" y="0" width="1280" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="74" y="100" class="title">資料科學最常用的 Python 套件</text>
  <text x="74" y="142" class="subtitle">它們不是彼此取代，而是各自負責不同層的工作。</text>

  <g filter="url(#shadow)">
    <rect x="384" y="220" width="512" height="198" rx="34" fill="#1F6BFF"/>
    <rect x="70" y="242" width="268" height="154" rx="28" fill="#FFFFFF" stroke="#BFD5FF" stroke-width="3"/>
    <rect x="70" y="434" width="268" height="154" rx="28" fill="#FFFFFF" stroke="#C9E4D3" stroke-width="3"/>
    <rect x="942" y="242" width="268" height="170" rx="28" fill="#FFFFFF" stroke="#FFD3AF" stroke-width="3"/>
    <rect x="942" y="428" width="268" height="180" rx="28" fill="#FFFFFF" stroke="#FFE2A1" stroke-width="3"/>
    <rect x="210" y="610" width="860" height="82" rx="24" fill="#FFFFFF" stroke="#DEE6F0" stroke-width="3"/>
  </g>

  <line x1="338" y1="320" x2="384" y2="328" stroke="#ADC5FF" stroke-width="4"/>
  <line x1="338" y1="510" x2="384" y2="394" stroke="#C6DFCF" stroke-width="4"/>
  <line x1="896" y1="328" x2="942" y2="326" stroke="#FFD1AC" stroke-width="4"/>
  <line x1="896" y1="394" x2="942" y2="518" stroke="#FFE09A" stroke-width="4"/>

  <text x="640" y="282" text-anchor="middle" class="core-tag">日常工作核心</text>
  <text x="640" y="332" text-anchor="middle" class="core-title">資料讀取、整理、分析、解釋</text>
  <text x="640" y="376" text-anchor="middle" class="core-text">通常不會只靠單一套件完成</text>

  <text x="204" y="286" text-anchor="middle" class="tag">數值地基</text>
  <text x="204" y="330" text-anchor="middle" class="card-title">NumPy</text>
  <text x="204" y="366" text-anchor="middle" class="card-text">高效陣列與</text>
  <text x="204" y="396" text-anchor="middle" class="card-text">矩陣運算</text>

  <text x="204" y="478" text-anchor="middle" class="tag">資料表主力</text>
  <text x="204" y="522" text-anchor="middle" class="card-title">Pandas</text>
  <text x="204" y="558" text-anchor="middle" class="card-text">DataFrame、索引、</text>
  <text x="204" y="588" text-anchor="middle" class="card-text">時間序列</text>

  <text x="1076" y="286" text-anchor="middle" class="tag">科學計算補強</text>
  <text x="1076" y="330" text-anchor="middle" class="card-title">SciPy</text>
  <text x="1076" y="366" text-anchor="middle" class="card-text">線性代數、最佳化、</text>
  <text x="1076" y="396" text-anchor="middle" class="card-text">訊號處理</text>

  <text x="1076" y="478" text-anchor="middle" class="tag">建模起點</text>
  <text x="1076" y="522" text-anchor="middle" class="card-title">Scikit-learn</text>
  <text x="1076" y="554" text-anchor="middle" class="card-text">分類、回歸、分群</text>
  <text x="1076" y="586" text-anchor="middle" class="card-text">與評估</text>

  <text x="640" y="644" text-anchor="middle" class="bottom">Matplotlib + Seaborn：把資料趨勢、分佈與差異畫給人看</text>
  <text x="640" y="672" text-anchor="middle" class="card-text">前者是底層繪圖能力，後者是更偏分析場景的高階封裝。</text>
</svg>
