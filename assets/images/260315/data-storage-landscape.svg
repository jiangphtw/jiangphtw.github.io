<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">資料儲存方式分類</title>
  <desc id="desc">把資料儲存分成檔案格式、關聯式資料庫與向量資料庫三大類。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d9dde8" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 60px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; }
      .subtitle { font: 400 26px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
      .card-title { font: 700 34px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .line { font: 400 24px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; text-anchor: middle; }
      .badge { font: 700 22px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="88" y="118" class="title">資料儲存有不同類型與用途</text>
  <text x="88" y="170" class="subtitle">先分清楚檔案格式、關聯式資料庫、專門型資料庫，後面的選型才會準。</text>

  <g filter="url(#shadow)">
    <rect x="110" y="280" width="420" height="330" rx="34" fill="#ffffff" stroke="#ffb17a" stroke-width="4"/>
    <rect x="590" y="280" width="420" height="330" rx="34" fill="#ffffff" stroke="#8cb9ff" stroke-width="4"/>
    <rect x="1070" y="280" width="420" height="330" rx="34" fill="#ffffff" stroke="#77cdb5" stroke-width="4"/>
  </g>

  <rect x="220" y="242" width="200" height="54" rx="20" fill="#ff9b66"/>
  <rect x="700" y="242" width="200" height="54" rx="20" fill="#6ea5ff"/>
  <rect x="1180" y="242" width="200" height="54" rx="20" fill="#36b58f"/>

  <text x="320" y="277" class="badge">檔案格式</text>
  <text x="800" y="277" class="badge">關聯式資料庫</text>
  <text x="1280" y="277" class="badge">專門型資料庫</text>

  <text x="320" y="378" class="card-title">CSV / JSON / Parquet</text>
  <text x="320" y="438" class="line">適合交換、備份</text>
  <text x="320" y="474" class="line">或分析資料集</text>
  <text x="320" y="510" class="line">但不等於多人共用主資料庫</text>

  <text x="800" y="378" class="card-title">SQLite / PostgreSQL</text>
  <text x="800" y="438" class="line">有 schema、查詢、索引</text>
  <text x="800" y="474" class="line">transaction、權限與一致性</text>
  <text x="800" y="510" class="line">適合正式管理結構化資料</text>

  <text x="1280" y="378" class="card-title">zvec 等向量資料庫</text>
  <text x="1280" y="438" class="line">面向 embedding 與相似度搜尋</text>
  <text x="1280" y="474" class="line">適合 semantic search、RAG</text>
  <text x="1280" y="510" class="line">不是一般交易主資料庫</text>
</svg>
