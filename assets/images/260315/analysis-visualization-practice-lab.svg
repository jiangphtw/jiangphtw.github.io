<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">資料分析與視覺化練習題設計</title>
  <desc id="desc">三個練習題卡片，分別是電商轉換、客服工單與門市來客。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="100%" stop-color="#f2f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d9dde8" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 60px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; }
      .subtitle { font: 400 26px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
      .card-title { font: 700 34px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .card-line { font: 400 23px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; text-anchor: middle; }
      .badge { font: 700 22px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #ffffff; text-anchor: middle; }
      .footer { font: 700 28px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #0f8a74; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>

  <text x="88" y="118" class="title">三組可以自己動手做的練習</text>
  <text x="88" y="170" class="subtitle">每一題都同時練分析問題、指標計算、圖表選擇與最後的文字結論。</text>

  <g filter="url(#shadow)">
    <rect x="100" y="280" width="430" height="360" rx="34" fill="#ffffff" stroke="#ffb17a" stroke-width="4"/>
    <rect x="585" y="280" width="430" height="360" rx="34" fill="#ffffff" stroke="#8cb9ff" stroke-width="4"/>
    <rect x="1070" y="280" width="430" height="360" rx="34" fill="#ffffff" stroke="#77cdb5" stroke-width="4"/>
  </g>

  <rect x="230" y="242" width="170" height="52" rx="20" fill="#ff9b66"/>
  <rect x="715" y="242" width="170" height="52" rx="20" fill="#6ea5ff"/>
  <rect x="1200" y="242" width="170" height="52" rx="20" fill="#36b58f"/>

  <text x="315" y="276" class="badge">練習 1</text>
  <text x="800" y="276" class="badge">練習 2</text>
  <text x="1285" y="276" class="badge">練習 3</text>

  <text x="315" y="374" class="card-title">電商流量與轉換率</text>
  <text x="315" y="432" class="card-line">算 conversion rate</text>
  <text x="315" y="468" class="card-line">比較通路差異</text>
  <text x="315" y="504" class="card-line">用趨勢圖與長條圖說明</text>

  <text x="800" y="374" class="card-title">客服工單與滿意度</text>
  <text x="800" y="432" class="card-line">看處理時間分布</text>
  <text x="800" y="468" class="card-line">檢查 csat 是否受影響</text>
  <text x="800" y="504" class="card-line">找出異常值並解釋</text>

  <text x="1285" y="374" class="card-title">門市來客與天氣</text>
  <text x="1285" y="432" class="card-line">算來客轉換率</text>
  <text x="1285" y="468" class="card-line">比較促銷與降雨差異</text>
  <text x="1285" y="504" class="card-line">選兩張圖做一頁報告</text>

  <rect x="300" y="660" width="1000" height="122" rx="28" fill="#ecfff9" stroke="#79ccb7" stroke-width="4"/>
  <text x="800" y="718" class="footer">做完每一題後，都試著用一句話寫出你真正的判斷</text>
  <text x="800" y="758" class="footer">而不是只停在圖表本身。</text>
</svg>
