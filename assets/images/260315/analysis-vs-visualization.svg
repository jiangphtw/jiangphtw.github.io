<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">資料分析與資料視覺化的分工</title>
  <desc id="desc">左側說明資料分析，右側說明資料視覺化，中間以箭頭串接為同一流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="100%" stop-color="#f2f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d9dde8" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#c8d6ef"/>
    </marker>
    <style>
      .title { font: 700 62px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; }
      .subtitle { font: 400 26px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
      .card-title { font: 700 38px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .card-line { font: 400 24px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; text-anchor: middle; }
      .note { font: 700 30px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #1f5ed9; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>

  <text x="88" y="118" class="title">資料分析與資料視覺化不是兩件分開的事</text>
  <text x="88" y="170" class="subtitle">前者負責把問題拆成指標與比較，後者負責把模式、異常與差異呈現出來。</text>

  <line x1="660" y1="430" x2="940" y2="430" stroke="#dbe4f3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="160" y="280" width="500" height="320" rx="36" fill="#fff6ef" stroke="#ffb17a" stroke-width="5"/>
    <rect x="940" y="280" width="500" height="320" rx="36" fill="#eef6ff" stroke="#8cb9ff" stroke-width="5"/>
  </g>

  <text x="410" y="380" class="card-title">資料分析</text>
  <text x="410" y="446" class="card-line">定義問題與分析單位</text>
  <text x="410" y="484" class="card-line">選指標、切分、比較</text>
  <text x="410" y="522" class="card-line">把數字整理成可判讀結論</text>

  <text x="1190" y="380" class="card-title">資料視覺化</text>
  <text x="1190" y="446" class="card-line">讓趨勢、差異、異常被看見</text>
  <text x="1190" y="484" class="card-line">幫自己探索，也幫別人理解</text>
  <text x="1190" y="522" class="card-line">把結論變成可溝通的畫面</text>

  <rect x="350" y="690" width="900" height="96" rx="28" fill="#eaf1ff" stroke="#93b0ff" stroke-width="4"/>
  <text x="800" y="750" class="note">好分析幾乎都需要視覺化；好視覺化背後也一定有分析</text>
</svg>
