<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">資料型態分類</title>
  <desc id="desc">三欄卡片說明結構化資料、半結構化資料、非結構化資料的特徵與例子。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f2" />
      <stop offset="100%" stop-color="#f4f8ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d9dde8" flood-opacity="0.45" />
    </filter>
    <style>
      .title { font: 700 62px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; }
      .subtitle { font: 400 26px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; }
      .card-title { font: 700 36px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #183153; text-anchor: middle; }
      .card-line { font: 400 24px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #5c7296; text-anchor: middle; }
      .badge { font: 700 24px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #ffffff; text-anchor: middle; }
      .footer { font: 700 28px "Noto Sans TC","Microsoft JhengHei",sans-serif; fill: #0f8a74; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)" />

  <text x="88" y="118" class="title">先分清楚資料長什麼樣</text>
  <text x="88" y="170" class="subtitle">蒐集方式、清理成本與儲存方式，通常都跟資料型態直接相關。</text>

  <g filter="url(#shadow)">
    <rect x="110" y="260" width="408" height="420" rx="34" fill="#ffffff" stroke="#9ec0ff" stroke-width="5" />
    <rect x="596" y="260" width="408" height="420" rx="34" fill="#ffffff" stroke="#ffb278" stroke-width="5" />
    <rect x="1082" y="260" width="408" height="420" rx="34" fill="#ffffff" stroke="#7ccfb6" stroke-width="5" />
  </g>

  <rect x="232" y="220" width="164" height="60" rx="22" fill="#6ea5ff" />
  <rect x="718" y="220" width="164" height="60" rx="22" fill="#ff9c5c" />
  <rect x="1204" y="220" width="164" height="60" rx="22" fill="#36b58f" />

  <text x="314" y="260" class="badge">結構化</text>
  <text x="800" y="260" class="badge">半結構化</text>
  <text x="1286" y="260" class="badge">非結構化</text>

  <text x="314" y="358" class="card-title">欄位固定</text>
  <text x="314" y="420" class="card-line">每筆資料都有一致格式</text>
  <text x="314" y="462" class="card-line">可直接用 SQL 查詢</text>
  <text x="314" y="504" class="card-line">例：資料表、交易紀錄</text>
  <text x="314" y="546" class="card-line">試算表、會員主檔</text>

  <text x="800" y="358" class="card-title">有欄位但不完全固定</text>
  <text x="800" y="420" class="card-line">每筆資料不一定有同欄位</text>
  <text x="800" y="462" class="card-line">常見巢狀結構與陣列</text>
  <text x="800" y="504" class="card-line">例：JSON、XML、事件 log</text>
  <text x="800" y="546" class="card-line">通常要先展開再分析</text>

  <text x="1286" y="358" class="card-title">沒有固定欄位</text>
  <text x="1286" y="420" class="card-line">內容先天就不是表格</text>
  <text x="1286" y="462" class="card-line">例：文章、網頁、圖片</text>
  <text x="1286" y="504" class="card-line">客服對話、PDF、音訊</text>
  <text x="1286" y="546" class="card-line">通常要先抽取特徵</text>

  <rect x="380" y="748" width="840" height="96" rx="30" fill="#ecfff9" stroke="#79ccb7" stroke-width="4" />
  <text x="800" y="808" class="footer">先看資料格式，再決定要怎麼抓、怎麼清、怎麼存</text>
</svg>
