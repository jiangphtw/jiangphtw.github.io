<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="72" y1="56" x2="1208" y2="664" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4EC"/>
      <stop offset="1" stop-color="#F6FAFF"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #18314F; }
      .subtitle { font: 400 23px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #5B708A; }
      .tag { font: 700 18px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #FF7A59; }
      .card-title { font: 700 30px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #18314F; }
      .card-text { font: 400 20px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #536983; }
      .note-title { font: 700 26px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #36539A; }
      .note-text { font: 500 20px 'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; fill: #49617E; }
    </style>
    <filter id="shadow" x="0" y="0" width="1280" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="74" y="102" class="title">資料科學的基本步驟</text>
  <text x="74" y="144" class="subtitle">這是入門版流程圖。真實專案通常會來回迭代，不會只走一次。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="240" width="180" height="220" rx="28" fill="#FFFFFF" stroke="#FFD1AD" stroke-width="3"/>
    <rect x="300" y="240" width="180" height="220" rx="28" fill="#FFFFFF" stroke="#FFC49A" stroke-width="3"/>
    <rect x="530" y="240" width="180" height="220" rx="28" fill="#FFFFFF" stroke="#FFB27B" stroke-width="3"/>
    <rect x="760" y="240" width="180" height="220" rx="28" fill="#FFFFFF" stroke="#FFA86A" stroke-width="3"/>
    <rect x="990" y="240" width="180" height="220" rx="28" fill="#FFFFFF" stroke="#FF9552" stroke-width="3"/>
  </g>

  <line x1="250" y1="350" x2="300" y2="350" stroke="#D7DEE9" stroke-width="6"/>
  <line x1="480" y1="350" x2="530" y2="350" stroke="#D7DEE9" stroke-width="6"/>
  <line x1="710" y1="350" x2="760" y2="350" stroke="#D7DEE9" stroke-width="6"/>
  <line x1="940" y1="350" x2="990" y2="350" stroke="#D7DEE9" stroke-width="6"/>

  <text x="160" y="286" text-anchor="middle" class="tag">STEP 1</text>
  <text x="160" y="334" text-anchor="middle" class="card-title">資料蒐集</text>
  <text x="160" y="378" text-anchor="middle" class="card-text">來源、欄位</text>
  <text x="160" y="412" text-anchor="middle" class="card-text">時間範圍</text>

  <text x="390" y="286" text-anchor="middle" class="tag">STEP 2</text>
  <text x="390" y="334" text-anchor="middle" class="card-title">資料清理</text>
  <text x="390" y="378" text-anchor="middle" class="card-text">缺值、重複</text>
  <text x="390" y="412" text-anchor="middle" class="card-text">格式與口徑</text>

  <text x="620" y="286" text-anchor="middle" class="tag">STEP 3</text>
  <text x="620" y="334" text-anchor="middle" class="card-title">資料儲存</text>
  <text x="620" y="378" text-anchor="middle" class="card-text">建立可重複</text>
  <text x="620" y="412" text-anchor="middle" class="card-text">查詢的結構</text>

  <text x="850" y="286" text-anchor="middle" class="tag">STEP 4</text>
  <text x="850" y="334" text-anchor="middle" class="card-title">資料分析</text>
  <text x="850" y="378" text-anchor="middle" class="card-text">用統計與分析</text>
  <text x="850" y="412" text-anchor="middle" class="card-text">方法找規律</text>

  <text x="1080" y="286" text-anchor="middle" class="tag">STEP 5</text>
  <text x="1080" y="334" text-anchor="middle" class="card-title">資料視覺化</text>
  <text x="1080" y="378" text-anchor="middle" class="card-text">把結果變成</text>
  <text x="1080" y="412" text-anchor="middle" class="card-text">團隊看得懂的圖</text>

  <rect x="90" y="540" width="470" height="112" rx="26" fill="#FFFFFF" stroke="#9A97E0" stroke-width="3" stroke-dasharray="12 10"/>
  <rect x="720" y="540" width="470" height="112" rx="26" fill="#FFFFFF" stroke="#86D0B5" stroke-width="3" stroke-dasharray="12 10"/>

  <text x="126" y="588" class="note-title">前面通常還有：定義問題</text>
  <text x="126" y="624" class="note-text">先知道要回答什麼，才知道該收什麼資料。</text>

  <text x="756" y="588" class="note-title" fill="#1E8E6A">最後通常還要：採取行動</text>
  <text x="756" y="624" class="note-text">依結果做決策，再回頭修正問題與資料。</text>
</svg>
