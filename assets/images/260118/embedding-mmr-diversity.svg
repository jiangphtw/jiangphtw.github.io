<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="MMR 在相關性與多樣性間取捨的示意圖">
  <title>MMR：在相關性與多樣性間取捨</title>
  <defs>
    <style>
      .title { font: 600 24px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, sans-serif; fill: #111827; }
      .small { font: 12px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, sans-serif; fill: #374151; }
      .muted { fill: #6B7280; }
      .box { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 2; rx: 14; }
      .pill { stroke-width: 2; rx: 10; }
      .arrow { stroke: #6B7280; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
  <text x="480" y="48" text-anchor="middle" class="title">MMR：避免 Top-K 過度重複（示意）</text>

  <!-- Query -->
  <rect x="60" y="110" width="220" height="80" class="box"/>
  <text x="170" y="145" text-anchor="middle" class="label">Query</text>
  <text x="170" y="170" text-anchor="middle" class="small muted">「推薦系統如何使用 embedding？」</text>

  <path d="M280 150 L340 150" class="arrow"/>
  <rect x="340" y="110" width="250" height="80" class="box"/>
  <text x="465" y="145" text-anchor="middle" class="label">相似度排序</text>
  <text x="465" y="170" text-anchor="middle" class="small muted">取 Top-K（可能重複）</text>

  <path d="M590 150 L650 150" class="arrow"/>

  <!-- Top-K list -->
  <rect x="650" y="80" width="250" height="140" class="box"/>
  <text x="775" y="110" text-anchor="middle" class="label">Top-K（只看相關）</text>

  <rect x="680" y="125" width="190" height="18" fill="#DBEAFE" stroke="#93C5FD" class="pill"/>
  <text x="690" y="139" class="small">#1 推薦系統 embedding</text>

  <rect x="680" y="150" width="190" height="18" fill="#DBEAFE" stroke="#93C5FD" class="pill"/>
  <text x="690" y="164" class="small">#2 推薦系統 embedding</text>

  <rect x="680" y="175" width="190" height="18" fill="#DBEAFE" stroke="#93C5FD" class="pill"/>
  <text x="690" y="189" class="small">#3 推薦系統 embedding</text>

  <text x="775" y="212" text-anchor="middle" class="small muted">（內容相似、資訊重疊）</text>

  <!-- MMR -->
  <path d="M560 260 L650 260" class="arrow"/>
  <rect x="340" y="230" width="250" height="80" class="box"/>
  <text x="465" y="265" text-anchor="middle" class="label">MMR 選擇</text>
  <text x="465" y="290" text-anchor="middle" class="small muted">相關性 × 多樣性</text>

  <!-- Selected list -->
  <rect x="650" y="240" width="250" height="140" class="box"/>
  <text x="775" y="270" text-anchor="middle" class="label">MMR（相關且不重複）</text>

  <rect x="680" y="285" width="190" height="18" fill="#DBEAFE" stroke="#93C5FD" class="pill"/>
  <text x="690" y="299" class="small">#1 推薦系統 embedding</text>

  <rect x="680" y="310" width="190" height="18" fill="#D1FAE5" stroke="#6EE7B7" class="pill"/>
  <text x="690" y="324" class="small">#4 內積打分 + 負採樣</text>

  <rect x="680" y="335" width="190" height="18" fill="#FEF3C7" stroke="#FCD34D" class="pill"/>
  <text x="690" y="349" class="small">#7 召回 vs 排序的角色</text>

  <text x="775" y="372" text-anchor="middle" class="small muted">（覆蓋面更廣）</text>
</svg>

