<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="One-hot 與 Embedding 的差異示意圖">
  <title>One-hot 與 Embedding 的差異</title>
  <defs>
    <style>
      .title { font: 600 24px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, sans-serif; fill: #111827; }
      .small { font: 12px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, sans-serif; fill: #374151; }
      .box { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 2; rx: 14; }
      .arrow { stroke: #6B7280; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .muted { fill: #6B7280; }
      .blue { fill: #2563EB; }
      .bar { fill: #10B981; }
      .stroke { stroke: #D1D5DB; stroke-width: 1.5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>

  <text x="480" y="48" text-anchor="middle" class="title">One-hot → Embedding（把稀疏高維壓成稠密低維）</text>

  <!-- Input -->
  <text x="150" y="92" text-anchor="middle" class="label">輸入（離散 ID）</text>
  <rect x="60" y="110" width="180" height="70" class="box"/>
  <text x="150" y="150" text-anchor="middle" class="label">token:「國王」</text>
  <text x="150" y="170" text-anchor="middle" class="small">token_id = 12345</text>

  <!-- Arrow to one-hot -->
  <path d="M240 145 L300 145" class="arrow"/>

  <!-- One-hot box -->
  <rect x="300" y="90" width="290" height="300" class="box"/>
  <text x="445" y="120" text-anchor="middle" class="label">One-hot（|V| 維，稀疏）</text>
  <text x="445" y="142" text-anchor="middle" class="small">只有一個位置是 1，其餘皆為 0</text>

  <!-- Sparse vector visualization -->
  <text x="330" y="170" class="small muted">...</text>
  <g transform="translate(360,170)">
    <!-- Column of squares -->
    <rect x="0" y="0" width="18" height="18" fill="#FFFFFF" class="stroke"/>
    <rect x="0" y="22" width="18" height="18" fill="#FFFFFF" class="stroke"/>
    <rect x="0" y="44" width="18" height="18" fill="#FFFFFF" class="stroke"/>
    <rect x="0" y="66" width="18" height="18" fill="#FFFFFF" class="stroke"/>
    <rect x="0" y="88" width="18" height="18" fill="#FFFFFF" class="stroke"/>
    <rect x="0" y="110" width="18" height="18" fill="#FFFFFF" class="stroke"/>
    <rect x="0" y="132" width="18" height="18" fill="#FFFFFF" class="stroke"/>
    <rect x="0" y="154" width="18" height="18" fill="#FFFFFF" class="stroke"/>

    <!-- Highlight one position -->
    <rect x="0" y="110" width="18" height="18" class="blue" opacity="0.95"/>
  </g>
  <text x="445" y="365" text-anchor="middle" class="small muted">（示意：實際 |V| 可能是數萬以上）</text>

  <!-- Arrow to embedding -->
  <path d="M590 145 L650 145" class="arrow"/>

  <!-- Embedding box -->
  <rect x="650" y="90" width="250" height="300" class="box"/>
  <text x="775" y="120" text-anchor="middle" class="label">Embedding（d 維，稠密）</text>
  <text x="775" y="142" text-anchor="middle" class="small">每個維度都是實數，可學習</text>

  <!-- Arrow label (placed above boxes to avoid overlap) -->
  <text x="620" y="82" text-anchor="middle" class="small muted">查表矩陣 E（|V| × d）</text>

  <!-- Dense vector visualization -->
  <line x1="700" y1="180" x2="700" y2="330" stroke="#D1D5DB" stroke-width="2"/>
  <text x="700" y="170" text-anchor="middle" class="small muted">0</text>

  <rect x="700" y="190" width="120" height="16" class="bar" opacity="0.95"/>
  <rect x="700" y="214" width="70" height="16" class="bar" opacity="0.75"/>
  <rect x="700" y="238" width="150" height="16" class="bar" opacity="0.85"/>
  <rect x="700" y="262" width="40" height="16" class="bar" opacity="0.7"/>
  <rect x="700" y="286" width="105" height="16" class="bar" opacity="0.9"/>
  <rect x="700" y="310" width="90" height="16" class="bar" opacity="0.8"/>

  <text x="775" y="365" text-anchor="middle" class="small muted">（示意：d 常見 64～1536+）</text>
</svg>
