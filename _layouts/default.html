<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-Hant' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="{{ page.theme_color | default: '#f2f0e9' }}" />
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem("jp-font-size") === "large") {
          document.documentElement.classList.add("large-type");
        }
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/jekyll.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/mono-template.css' | relative_url }}" />
    <script src="{{ '/assets/main.js' | relative_url }}" defer></script>
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
