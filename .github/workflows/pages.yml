name: Deploy Jekyll site and courses to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            course/資料科學/package-lock.json
            course/股票新聞選股/package-lock.json
            course/設計思考/package-lock.json
            course/作業研究/package-lock.json
            course/ai-product-engineering/package-lock.json
            course/notebooklm-academic/package-lock.json
            course/oral-history-ai/package-lock.json

      - name: Install and test data science course
        working-directory: course/資料科學
        run: |
          npm ci
          npm run lint
          npm test

      - name: Install and test stock decision course
        working-directory: course/股票新聞選股
        run: |
          npm ci
          npm run lint
          npm test

      - name: Install and test design thinking course
        working-directory: course/設計思考
        run: |
          npm ci
          npm run lint
          npm test

      - name: Install and test operations research course
        working-directory: course/作業研究
        run: |
          npm ci
          npm run lint
          npm test

      - name: Install and test AI product engineering course
        working-directory: course/ai-product-engineering
        run: |
          npm ci
          npm run lint
          npm test

      - name: Install and test Gemini Notebook academic course
        working-directory: course/notebooklm-academic
        run: |
          npm ci
          npm run lint
          npm test

      - name: Install and test oral history course
        working-directory: course/oral-history-ai
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Make Jekyll output writable
        run: sudo chown -R "$(id -u):$(id -g)" "_site"

      - name: Add static courses to the site
        run: |
          mkdir -p "_site/course/data-science" "_site/course/stock-decision" "_site/course/design-thinking" "_site/course/operations-research" "_site/course/ai-product-engineering" "_site/course/notebooklm-academic" "_site/course/oral-history-ai"
          cp -a "course/資料科學/out/." "_site/course/data-science/"
          cp -a "course/股票新聞選股/out/." "_site/course/stock-decision/"
          cp -a "course/設計思考/out/." "_site/course/design-thinking/"
          cp -a "course/作業研究/out/." "_site/course/operations-research/"
          cp -a "course/ai-product-engineering/out/." "_site/course/ai-product-engineering/"
          cp -a "course/notebooklm-academic/out/." "_site/course/notebooklm-academic/"
          cp -a "course/oral-history-ai/out/." "_site/course/oral-history-ai/"

      - name: Verify assembled Pages artifact
        run: |
          test -f "_site/courses.html"
          test -f "_site/course/data-science/index.html"
          test -f "_site/course/stock-decision/index.html"
          test -f "_site/course/design-thinking/index.html"
          test -f "_site/course/operations-research/index.html"
          test -f "_site/course/ai-product-engineering/index.html"
          test -f "_site/course/notebooklm-academic/index.html"
          test -f "_site/course/oral-history-ai/index.html"
          test -f "_site/course/sustainability/index.html"
          test -f "_site/course/sustainability/course-data.js"
          test -f "_site/course/sustainability/app.js"
          test -f "_site/course/sustainability/styles.css"
          test -d "_site/course/data-science/_next"
          test -d "_site/course/stock-decision/_next"
          test -d "_site/course/design-thinking/_next"
          test -d "_site/course/operations-research/_next"
          test -d "_site/course/ai-product-engineering/_next"
          test -d "_site/course/notebooklm-academic/_next"
          test -d "_site/course/oral-history-ai/_next"
          grep -q "/course/data-science/" "_site/courses.html"
          grep -q "/course/stock-decision/" "_site/courses.html"
          grep -q "/course/design-thinking/" "_site/courses.html"
          grep -q "/course/operations-research/" "_site/courses.html"
          grep -q "/course/ai-product-engineering/" "_site/courses.html"
          grep -q "/course/notebooklm-academic/" "_site/courses.html"
          grep -q "/course/oral-history-ai/" "_site/courses.html"
          grep -q "/course/sustainability/" "_site/courses.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
