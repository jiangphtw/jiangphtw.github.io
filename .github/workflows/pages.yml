name: Deploy Jekyll site and courses to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_VERSION: "10.9.4"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "course/*/package-lock.json"

      - name: Pin npm version
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install and test all Node courses
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' package_json; do
            course_dir="$(dirname "$package_json")"
            echo "::group::${course_dir}"

            npm --prefix "$course_dir" install \
              --package-lock-only \
              --ignore-scripts \
              --no-audit \
              --no-fund

            if [[ -n "$(git status --porcelain -- "$course_dir/package-lock.json")" ]]; then
              echo "::warning file=$course_dir/package-lock.json::Lockfile was normalized with npm $NPM_VERSION; regenerate it locally with npx npm@$NPM_VERSION install --package-lock-only."
            fi

            npm --prefix "$course_dir" ci --no-audit --no-fund
            npm --prefix "$course_dir" run lint --if-present
            npm --prefix "$course_dir" test --if-present
            echo "::endgroup::"
          done < <(find course -mindepth 2 -maxdepth 2 -type f -name package.json -print0 | sort -z)

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Make Jekyll output writable
        run: sudo chown -R "$(id -u):$(id -g)" "_site"

      - name: Add static courses to the site
        run: |
          mkdir -p "_site/course/data-science" "_site/course/stock-decision" "_site/course/design-thinking" "_site/course/operations-research" "_site/course/ai-product-engineering" "_site/course/notebooklm-academic" "_site/course/oral-history-ai" "_site/course/sustainability"
          cp -a "course/資料科學/out/." "_site/course/data-science/"
          cp -a "course/股票新聞選股/out/." "_site/course/stock-decision/"
          cp -a "course/設計思考/out/." "_site/course/design-thinking/"
          cp -a "course/作業研究/out/." "_site/course/operations-research/"
          cp -a "course/ai-product-engineering/out/." "_site/course/ai-product-engineering/"
          cp -a "course/notebooklm-academic/out/." "_site/course/notebooklm-academic/"
          cp -a "course/oral-history-ai/out/." "_site/course/oral-history-ai/"
          cp -a "course/sustainability/out/." "_site/course/sustainability/"

      - name: Verify assembled Pages artifact
        run: |
          test -f "_site/courses.html"
          test -f "_site/course/data-science/index.html"
          test -f "_site/course/stock-decision/index.html"
          test -f "_site/course/design-thinking/index.html"
          test -f "_site/course/operations-research/index.html"
          test -f "_site/course/ai-product-engineering/index.html"
          test -f "_site/course/notebooklm-academic/index.html"
          test -f "_site/course/oral-history-ai/index.html"
          test -f "_site/course/sustainability/index.html"
          test -d "_site/course/data-science/_next"
          test -d "_site/course/stock-decision/_next"
          test -d "_site/course/design-thinking/_next"
          test -d "_site/course/operations-research/_next"
          test -d "_site/course/ai-product-engineering/_next"
          test -d "_site/course/notebooklm-academic/_next"
          test -d "_site/course/oral-history-ai/_next"
          test -d "_site/course/sustainability/_next"
          grep -q "/course/data-science/" "_site/courses.html"
          grep -q "/course/stock-decision/" "_site/courses.html"
          grep -q "/course/design-thinking/" "_site/courses.html"
          grep -q "/course/operations-research/" "_site/courses.html"
          grep -q "/course/ai-product-engineering/" "_site/courses.html"
          grep -q "/course/notebooklm-academic/" "_site/courses.html"
          grep -q "/course/oral-history-ai/" "_site/courses.html"
          grep -q "/course/sustainability/" "_site/courses.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
